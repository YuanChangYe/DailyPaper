# 每个工作日自动运行：抓取 → 筛选 → 精读 → 提交 docs/ 与 data/ → 构建并发布网站。
# 需要：仓库 Settings → Secrets and variables → Actions 中添加 ANTHROPIC_API_KEY；
#       Settings → Pages → Source 选 "GitHub Actions"。
name: daily

on:
  schedule:
    - cron: "0 6 * * 1-5"   # UTC 06:00（北京/新加坡时间 14:00），arXiv 当天的 RSS 已更新
  workflow_dispatch:
    inputs:
      args:
        description: "额外参数，例如 --provider fake 或 --disable read"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
  ZOTERO_USER_ID: ${{ vars.ZOTERO_USER_ID }}
  NO_MKDOCS_2_WARNING: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[pdf,site]"

      # 缺 Secret、模板或配置有误时在这里就失败，并把原因写进 Annotations
      - name: Preflight check
        env:
          EXTRA_ARGS: ${{ github.event.inputs.args }}
        run: dailypaper check $(echo "$EXTRA_ARGS" | grep -o -- '--provider [^ ]*' || true)

      - name: Run daily pipeline
        env:
          EXTRA_ARGS: ${{ github.event.inputs.args }}
        run: dailypaper run --enable git $EXTRA_ARGS

      - name: Build site
        run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 失败时把这次运行的检查点和用量日志打包，便于排查（在运行页面底部的 Artifacts 下载）
      - name: Upload run logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: |
            .cache/runs/
            !.cache/runs/**/*.jsonl
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
