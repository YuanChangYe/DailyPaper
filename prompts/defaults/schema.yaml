# 精读笔记的结构定义。提示词（prompts/base/deep_read.system.md.j2）、输出校验、网页、日报、
# 离线假模型都从这里读取，改结构只改这一个文件。
#
# meta:     笔记开头 ```json 块里的字段。key 是程序和网页依赖的字段名，不要改；label 是显示标签，可以改。
# sections: 正文的二级标题，按顺序输出为 "## N. 标题"。hint 是给模型的要求；deep: true 的节属于"深入阅读"，
#           网页目录在它们之前显示分隔线，reader.deep_read 的 deep_min_score 可以在低分论文上省掉它们。
# legacy:   旧版笔记用过的标签 / 标题，网页据此识别老笔记，不必迁移数据。

version: 2

meta:
  - key: tldr
    label: 一句话总结
    aliases: ["TL;DR"]
    required: true
    hint: 一句话（不超过 60 字）：做了什么、怎么做、结果如何（带关键数字）
  - key: core_insight
    label: 核心直觉
    aliases: ["Core insight"]
    required: true
    hint: 一句话讲出核心 idea 的本质（第 4 节的结论），不带公式
  - key: value_score
    label: 价值
    type: int
    min: 1
    max: 5
    required: true
    hint: 1–5 的整数，对上述研究方向的价值：5 = 必读且能直接启发研究者的工作；3 = 相关、值得了解；1 = 基本无关
  - key: worth_reading
    label: 要不要深入
    aliases: ["读不读"]
    required: true
    hint: 写"快速了解即可"或"值得 follow"，加一句理由（前 8 节够用，还是值得读第 9–13 节并看原文）

sections:
  - id: abstract_zh
    title: 摘要翻译
    hint: 把论文摘要完整、准确地翻译成中文，不增删内容；专业术语保留英文原文，必要时在括号里给中文。

  - id: problem
    title: 研究问题与价值
    hint: >-
      这篇论文提出并解决的研究问题是什么？先交代必要的背景，让非本方向的读者也能理解问题的 setting：任务、输入与输出、约束条件（访问权限、数据假设、计算预算）。
      然后回答：为什么这个问题重要？解决它能带来哪些价值（科学认知、实际应用、下游任务）？背景知识可以适当补充，但要和论文原文的说法区分开。

  - id: prior_work
    title: 已有工作与不足
    hint: >-
      这个问题之前被解决过吗？已有方法是怎么做的？它们为什么不够：失败模式是什么，在什么条件下失效，付出了什么代价？
      这一节要让读者看出本文 insight 的来源。只写能从原文或你确知的文献中追溯的工作并给出处；只能依据原文 related work 时注明"依据原文，未独立核实"。

  - id: reasoning_path
    title: 作者的思考路径与核心直觉
    hint: >-
      在讲方法之前，先重建作者可能的思考路径。不要把论文自己的贡献当作前提，只用论文之前已有的背景、失败模式、经验观察和相关工作，
      模拟作者的 inspiration 与 intuition：从上一节的不足出发，一步步推到"所以应该这样做"，让读者明白为什么从已有知识能自然想到这个 idea。
      最后用 2–4 句易懂、清晰、concise 的话讲出核心 idea 的本质，不带公式。这一节是你的重建而不是作者的原话，整节标〔分析〕。

  - id: method
    title: 方法与完整流程
    hint: >-
      论文的具体方法是什么？选一个真实的或贴近论文设定的具体例子，按 输入 → 处理 → 输出 讲完整的 pipeline，
      分点说明每一步做什么、为什么这样做、关键的设计选择或超参是什么。给出 1–3 个关键公式并解释每个符号。说明每个关键组件解决了上文的哪个不足。

  - id: math
    title: 核心数学推导
    hint: >-
      从理论视角一步步讲核心推导：先补充读者可能缺的理论背景（定义、引理、用到的定理），再按原文顺序推导，说明每一步的理论依据和直观含义。
      读者的数学基础较弱，宁可多解释一句。有理论保证时写清保证类型（如 marginal / conditional coverage、risk control、PAC、收敛性、遗憾界）、
      前提假设、是 finite-sample 还是渐近。论文没有数学推导时，一句话说明并跳过本节。公式用准确的 LaTeX。

  - id: experiments
    title: 实验设计与结论
    hint: >-
      按"提出了什么问题 → 设计了什么实验来回答 → 得到了什么答案"组织，每个问题一组。只要核心思路和结论，不罗列全部数据，关键数字带出处。
      对每个主要结论标出证据强度（强 / 中 / 弱 / 缺失），并说明 baseline 是否公平、有没有消融、是否报告方差或多 seed。

  - id: takeaways
    title: Take-aways
    hint: >-
      这篇论文的 take-aways：先写 5 句，再压成 3 句，再压成 1 句。写清对上述研究方向的意义。
      只想快速理解这篇论文的读者读到这里即可，下面各节是深入阅读。

  - id: fragile_assumption
    title: 最脆弱的假设
    deep: true
    hint: >-
      哪一个假设一旦不成立，核心贡献就站不住？只写最关键的一个。说明它出现在原文哪里，作者用什么支撑它（正面证据），
      哪些情形没有检验或有反面证据，以及它不成立时结论会如何变化。

  - id: min_reproduction
    title: 一周最小复现
    deep: true
    hint: >-
      如果有一周时间，设计一个最小实验验证论文的哪一点（优先验证上一节的假设或最核心的 claim）。
      写清数据（来源、规模）、实现（复用什么、自己写什么）、对照、指标、预期观察，以及什么结果算支持、什么结果算推翻。

  - id: counterexample
    title: 审稿人的反例设计
    deep: true
    hint: >-
      作为审稿人，如果要反对这篇论文，你会设计什么反例：一个实验、一个理论论证或一个真实场景，使方法失效或结论不再成立？
      给出替代解释，预测失效条件，说明反例的可信程度。每条批评指向论文的具体假设或陈述，并说最小的修补是什么。

  - id: follow_up_survey
    title: 后续研究调研
    deep: true
    hint: >-
      调研这篇论文之后的工作：有没有扩展、反驳、复现失败或带来新认知的研究？列出 3–5 项（标题、年份、与本文的关系），每项标注来源。
      有联网搜索工具时先搜索再写；没有搜索工具或搜不到时写"未联网检索，以下仅基于训练知识"或"未找到后续工作"，不要编造。

  - id: follow_up_idea
    title: Follow-up idea
    deep: true
    hint: >-
      在调研和思考之后，提出一个 novel 的 follow-up 研究方向。必须是实质性的、非增量的（不是换数据集、加模块、调超参），
      从方法的 limitation 和真实需求出发。写清：驱动需求（谁需要、为什么现有方法做不到）；可以借用的相邻领域工具或思路；
      第一个实验长什么样（数据、对照、指标、什么结果算成功）；与本文和已有工作的区别；至少两个可能失败的原因。标注为待验证的假设，不要宣称 novelty 已被证实。

legacy:
  # 旧版（version 1）正文的二级标题，网页据此把老笔记按旧结构显示
  section_titles:
    - TL;DR
    - Problem formulation
    - Core insight
    - Novelty delta
    - Mechanism
    - Guarantees & assumptions
    - Claim ↔ Evidence
    - Red flags & limitations
    - Research hooks
    - 是否值得读原文
