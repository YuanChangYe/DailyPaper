<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DailyPaper</title>
<meta name="description" content="每天从 arXiv 筛选 LLM / RAG / Agent 可信性方向的新论文，围绕 insight 与 novelty 精读，审核后一键入库 Zotero。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%230C232B'/%3E%3Cpath d='M8 23c4-5 8-5 12 0s8 5 12 0M8 16c4-5 8-5 12 0s8 5 12 0' fill='none' stroke='%23E6F0F2' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
/* Layout: a misty-fjord reading room. One framed photographic hero with drifting fog,
   then deep-teal panels of frosted glass; every view lives in the same shell. Single committed dark-teal look. */
:root{
  color-scheme:dark;
  --bg:#0C232B; --bg-2:#0F2C35; --panel:#12343F; --panel-2:#174150;
  --ink:#F2F7F8; --body:#BCD0D6; --muted:#8CA7AF;
  --mist:#EEF5F6; --accent:#A9DCE1;
  --line:rgba(214,232,237,.15); --line-2:rgba(214,232,237,.30);
  --glass:rgba(206,226,232,.10); --glass-2:rgba(206,226,232,.17); --glass-dark:rgba(9,29,36,.55);
  --ok:#93D7B0; --warn:#EBC983; --bad:#EFA195;
  --sans:Manrope,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--body);font:15px/1.7 var(--sans);overflow-x:clip;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 85% -10%,rgba(169,220,225,.10),transparent 60%),radial-gradient(900px 500px at -10% 40%,rgba(120,170,185,.08),transparent 60%);background-attachment:fixed}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.mono{font-family:var(--mono)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{color:var(--ink);text-wrap:balance;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--glass);color:var(--ink);font-weight:600;font-size:14px;transition:transform .18s,background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:var(--glass-2);border-color:rgba(214,232,237,.45)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--mist);color:#0C232B;border-color:transparent;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.btn.primary:hover{background:#fff;box-shadow:0 8px 28px rgba(169,220,225,.25)}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:4px 13px;font-size:13px}
.btn.ok{border-color:rgba(147,215,176,.5);color:var(--ok)}.btn.bad{border-color:rgba(239,161,149,.45);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:12px;color:var(--body);white-space:nowrap}
.chip.t-llm_uq{border-color:rgba(169,220,225,.45)}.chip.t-agent_uq{border-color:rgba(147,215,176,.45)}.chip.t-conformal_selective{border-color:rgba(235,201,131,.5)}.chip.t-agent_rsi{border-color:rgba(190,170,240,.5)}.chip.t-multiagent_trust{border-color:rgba(239,161,149,.5)}
.chip.dot:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.filter{cursor:pointer}.filter[aria-pressed="true"]{background:var(--mist);color:#0C232B;border-color:transparent}
.stars{color:var(--warn);letter-spacing:2px;font-size:13px}
.status{font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--line)}
.s-pending{color:var(--accent)}.s-approved{color:var(--warn);border-color:rgba(235,201,131,.4)}.s-imported{color:var(--ok);border-color:rgba(147,215,176,.4)}.s-later{color:var(--muted)}.s-rejected{color:var(--bad);border-color:rgba(239,161,149,.35)}.s-failed{color:var(--bad);border-color:var(--bad)}

/* ---------- nav ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:20;margin-top:12px}
.nav-bar{display:flex;align-items:center;gap:18px;padding:8px 10px 8px 18px;border-radius:999px;border:1px solid var(--line-2);background:rgba(12,35,43,.55);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 10px 40px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);font-size:18px;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.links{display:flex;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{padding:6px 14px;border-radius:999px;color:var(--muted);font-size:14px;white-space:nowrap;transition:color .2s,background .2s}
.links a:hover{color:var(--ink)}.links a[aria-current="page"]{color:var(--ink);background:var(--glass-2)}
.links .badge{font-size:11px;margin-left:5px;padding:0 6px;border-radius:999px;background:var(--warn);color:#0C232B;font-weight:700}
.mode{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:5px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.mode.local i{background:var(--ok);box-shadow:0 0 8px var(--ok)}.mode.static i{background:var(--accent)}.mode.demo i{background:var(--warn)}
.nav-end{display:flex;align-items:center;gap:8px}

/* ---------- views ---------- */
main{min-height:60vh}
.view{animation:viewIn .45s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:.7;transform:translateY(10px)}to{opacity:1;transform:none}}
.section{padding-block:56px 8px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.section-head h2{font-size:clamp(24px,3vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.section-head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.page-head{padding-block:40px 6px}
.page-head h1{font-size:clamp(30px,4vw,46px);letter-spacing:-.025em;line-height:1.15;font-weight:700}
.page-head p{color:var(--muted);margin:8px 0 0;max-width:62ch}
.reveal.play{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:.6;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- hero ---------- */
.hero{position:relative;margin-top:-64px;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.hero-stage{position:relative;isolation:isolate;overflow:hidden}
.hero-photo{position:absolute;inset:0;z-index:-3;overflow:hidden}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 35%;transform-origin:60% 40%;animation:kenburns 38s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
.hero-shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(95deg,rgba(9,30,38,.72) 0%,rgba(9,30,38,.38) 48%,rgba(9,30,38,.06) 80%),linear-gradient(180deg,rgba(9,30,38,.15) 0%,transparent 35%,rgba(9,30,38,.55) 100%)}
.fog{position:absolute;inset:-20% -40%;z-index:-1;pointer-events:none;filter:blur(24px);mix-blend-mode:screen;opacity:.75;
  background:radial-gradient(28% 18% at 22% 78%,rgba(240,248,250,.38),transparent 70%),radial-gradient(30% 16% at 64% 84%,rgba(240,248,250,.30),transparent 70%),radial-gradient(22% 14% at 90% 70%,rgba(240,248,250,.24),transparent 70%);
  animation:fog 46s linear infinite alternate}
.fog.f2{opacity:.5;animation-duration:70s;animation-direction:alternate-reverse;background:radial-gradient(26% 15% at 40% 72%,rgba(240,248,250,.32),transparent 70%),radial-gradient(24% 12% at 80% 90%,rgba(240,248,250,.26),transparent 70%)}
@keyframes fog{from{transform:translate3d(-9%,0,0)}to{transform:translate3d(9%,-2%,0)}}
.hero-inner{display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center;padding:124px 48px 214px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;color:var(--mist);padding:5px 13px;border-radius:999px;background:rgba(238,245,246,.12);border:1px solid rgba(238,245,246,.25);backdrop-filter:blur(8px)}
.hero h1{font-size:clamp(36px,5.4vw,68px);line-height:1.08;letter-spacing:-.03em;font-weight:700;margin:20px 0 14px;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.18)}
.hero .sub{color:rgba(238,245,246,.86);font-size:17px;margin:0 0 26px;max-width:40ch}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.float-card{justify-self:end;width:min(300px,100%);padding:12px;border-radius:22px;background:rgba(238,245,246,.14);border:1px solid rgba(238,245,246,.28);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);color:var(--mist);box-shadow:0 20px 50px rgba(0,0,0,.25);animation:bob 9s ease-in-out infinite;transition:transform .3s}
@keyframes bob{50%{transform:translateY(-8px)}}
.float-card .thumb{height:110px;border-radius:14px;background:linear-gradient(160deg,rgba(9,30,38,.15),rgba(9,30,38,.6)),url(assets/hero-mist-wide-1200.jpg) center 70%/cover;display:flex;align-items:flex-end;padding:10px;font-size:11px;letter-spacing:.06em}
.float-card h3{font-size:15px;line-height:1.35;margin:10px 4px 6px;color:#fff}
.float-card p{margin:0 4px 8px;font-size:12px;color:rgba(238,245,246,.75);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.float-card a{display:inline-flex;gap:6px;margin:0 4px 4px;font-size:12px;border-bottom:1px solid rgba(238,245,246,.4)}
.searchbox{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(640px,calc(100% - 32px));padding:12px;border-radius:22px;background:rgba(238,245,246,.14);border:1px solid rgba(238,245,246,.3);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.search-row{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;border-radius:999px;background:rgba(9,30,38,.38);border:1px solid rgba(238,245,246,.2)}
.search-row input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:15px}
.search-row input::placeholder{color:rgba(238,245,246,.6)}
.go{width:36px;height:36px;border-radius:50%;border:0;background:var(--mist);color:#0C232B;display:grid;place-items:center;flex:none}
.search-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.search-chips .chip{background:rgba(9,30,38,.3);border-color:rgba(238,245,246,.25);color:var(--mist);cursor:pointer}
.search-chips .chip:hover{background:rgba(238,245,246,.2)}
.search-hint{margin:8px 6px 0;font-size:12px;color:var(--mist);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.band{display:grid;grid-template-columns:1.1fr 1fr auto;gap:28px;align-items:center;padding:30px 48px;background:var(--bg-2);border-top:1px solid var(--line)}
.band h2{font-size:clamp(24px,3vw,34px);line-height:1.15;letter-spacing:-.02em;font-weight:700}
.band p{margin:0;color:var(--body);font-size:14px;border-left:1px solid var(--line-2);padding-left:24px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.stat{padding:18px 20px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass)}
.stat b{display:block;font-size:30px;line-height:1.2;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

/* ---------- paper cards ---------- */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);gap:16px;overflow-x:auto;padding:4px 2px 18px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pcard{position:relative;display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:var(--r-md);border:1px solid var(--line);background:linear-gradient(180deg,rgba(206,226,232,.09),rgba(206,226,232,.04));scroll-snap-align:start;transition:transform .25s,border-color .25s,background .25s,box-shadow .25s;min-width:0}
.pcard:hover{transform:translateY(-4px);border-color:var(--line-2);box-shadow:0 18px 40px rgba(0,0,0,.22)}
.pcard.is-picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pcard-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-right:34px}
.rank{font-size:22px;font-weight:800;color:var(--ink);line-height:1;margin-right:4px;font-variant-numeric:tabular-nums}
.pcard h3{font-size:17px;line-height:1.4;font-weight:700}
.pcard h3 a:hover{color:var(--accent)}
.pcard .chips{display:flex;gap:6px;flex-wrap:wrap}
.pcard .tldr{margin:0;font-size:14px;color:var(--body);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.insight{margin:0;font-size:13px;color:var(--mist);padding:10px 12px;border-radius:var(--r-sm);background:rgba(9,30,38,.35);border-left:2px solid var(--accent)}
.insight b{display:block;font-size:11px;letter-spacing:.08em;color:var(--accent);margin-bottom:2px}
.pcard-foot{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.pcard-foot .grow{flex:1}
.pcard-foot a{color:var(--accent)}
.zstate{font-size:12px}
.pick{position:absolute;top:16px;right:16px;width:24px;height:24px}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.pick span{display:block;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line-2);background:rgba(9,30,38,.3);transition:background .2s,border-color .2s}
.pick input:checked+span{background:var(--accent);border-color:var(--accent)}
.pick input:checked+span:after{content:"";display:block;width:6px;height:11px;margin:4px 0 0 8px;border:solid #0C232B;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- steps ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{padding:24px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.step .n{grid-row:span 2;font-size:40px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1.2px var(--line-2)}
.step h3{font-size:17px}.step p{margin:0;font-size:14px;color:var(--muted)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.topic{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);transition:transform .25s,border-color .25s;text-align:left}
.topic:hover{transform:translateY(-3px);border-color:var(--line-2)}
.topic b{color:var(--ink);font-size:15px}.topic span{font-size:13px;color:var(--muted)}
.topic .count{font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- daily ---------- */
.datebar{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.datebar::-webkit-scrollbar{display:none}
.datebar a{flex:none;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);text-align:center;line-height:1.25;min-width:70px}
.datebar a b{display:block;color:var(--ink);font-size:16px}.datebar a small{font-size:11px;color:var(--muted)}
.datebar a[aria-current="date"]{background:var(--mist);border-color:transparent}.datebar a[aria-current="date"] b,.datebar a[aria-current="date"] small{color:#0C232B}
.funnel{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin:6px 0 4px}
.funnel div{flex:1;min-width:110px;padding:12px 14px;border-radius:var(--r-sm);background:var(--glass);border:1px solid var(--line)}
.funnel b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}.funnel span{font-size:12px;color:var(--muted)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--glass)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;background:rgba(9,30,38,.25)}
tr:last-child td{border-bottom:0}
.bar{position:relative;width:76px;height:6px;border-radius:9px;background:rgba(206,226,232,.12);margin-top:8px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--accent)}

/* ---------- library ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}
.input{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:rgba(9,30,38,.35);outline:0;min-width:0}
.input:focus{border-color:var(--accent)}
.toolbar .input{flex:1 1 260px}
select.input{padding-right:30px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{position:relative;display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:start;padding:16px 56px 16px 18px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);transition:border-color .2s,background .2s}
.row:hover{border-color:var(--line-2);background:var(--glass-2)}
.row.is-picked{border-color:var(--accent)}
.row .when{font-size:12px;color:var(--muted);line-height:1.5}.row .when b{display:block;color:var(--ink);font-size:14px}
.row h3{font-size:16px;line-height:1.4}.row h3 a:hover{color:var(--accent)}
.row p{margin:4px 0 6px;font-size:14px;color:var(--body)}
.row .side{text-align:right;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.row .pick{top:18px;right:18px}
.empty{padding:36px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r-md);color:var(--muted)}

/* ---------- paper ---------- */
.paper-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;align-items:start;padding-top:32px}
.toc{position:sticky;top:100px;font-size:13px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);padding-left:4px}
.toc a{padding:5px 12px;border-radius:8px;color:var(--muted);border-left:2px solid transparent;margin-left:-5px}
.toc a:hover{color:var(--ink)}.toc a.on{color:var(--ink);border-left-color:var(--accent);background:var(--glass)}
.paper-head{padding:28px;border-radius:var(--r-lg);border:1px solid var(--line);background:linear-gradient(160deg,rgba(23,65,80,.6),rgba(12,35,43,.5)),url(assets/hero-mist-wide-1200.jpg) center 80%/cover;background-blend-mode:normal,soft-light}
.paper-head h1{font-size:clamp(24px,3vw,34px);line-height:1.3;letter-spacing:-.015em;margin:10px 0 12px}
.meta-line{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--body)}
.paper-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.prose{max-width:76ch;color:var(--body);font-size:16px;line-height:1.85;padding-top:10px}
.prose h1{display:none}
.prose h2{font-size:22px;margin:38px 0 12px;padding-top:6px;letter-spacing:-.01em}

<script type="text/markdown" id="demo-note">
# Calibrated for Which Policy? Conformal Uncertainty for Fixed World Models Under Intervention

> **作者** Ayush Mittal, Dhruv Gupta · **来源** [2610.35877v1](https://arxiv.org/abs/2610.35877) · [PDF](https://arxiv.org/pdf/2610.35877v1) · **方向** Selective Prediction via Conformal Prediction · **类型** theory · **价值** ★★★☆☆

> **TL;DR** 在预测器固定、条件机制 P(Y|X) 不变的假设下，用 domain classifier 估计 dQ_X/dP_X 并做 weighted conformal，给出 1−α−TV 与 classifier-regret 两层覆盖下界；在 192 个 Franka 转移的受控倾斜上把 55.0% 覆盖率恢复到 90.9%。

> **Core insight** 策略干预只改 X 的边缘分布而不改 P(Y|X) → 联合似然比只依赖 X、可由无标签 source/target 协变量学出 → 校准误差由 ratio 的 TV/L1 误差直接决定，预测器无需重训。

> **读不读** 选读：理论部分是 weighted conformal 加 TV 转移的清晰整合，对 agent 自我改进后阈值重校准有启发；实验过于受控，且只覆盖一步 marginal 的情形。

## 0. TL;DR
- 在 $P(Y|X)=Q(Y|X)$ 的假设下，策略干预等价于 covariate shift，ratio $w=dQ_X/dP_X$ 可由 domain classifier 学出。weighted conformal 在目标分布上的覆盖下界为 $1-\alpha-\mathrm{TV}(Q,\widehat Q)\ge 1-\alpha-\mathbb E_P|w-\widehat w|$，再由 classifier 的 log-loss regret 控制 $\mathbb E_P|w-\widehat w|$【Abstract, Prop. 3, Prop. 5】。
- 最强 shift（$\lambda=1.5$，名义 90%）下，ordinary conformal 覆盖 55.0%，oracle 91.0%，learned 90.9%；clip(5) 降到 83.8%【Table 1, Table 3】。
- 对 conformal_selective 方向是中等相关的参考。对 agent_rsi 的间接启发是：策略（自我）改变后，置信度门控的校准应随部署分布重做。但本文只做一步 marginal 预测，不涉及 LLM 或多步 agent【§9 Limitations】。

## 1. Problem formulation
- **输入/输出**：固定预测器 $m$ 与 score $r_m(X,Y)$；source 校准数据 $(X_i,Y_i)\sim P$ 带标签；目标是在 target 分布 $Q$ 上构造 $\mathcal C(X)$，使 $\mathbb P_Q\{Y\in\mathcal C(X)\}\ge 1-\alpha$【§2, §3】。
- **关键假设**：
  1. $P(Y|X)=Q(Y|X)$，且 $X$ 是"pre-outcome"变量（世界模型里 $X=(S,A)$）。
  2. $Q_X\ll P_X$（support 包含）。
  3. 校准样本 iid（实为 exchangeability），$\widehat w$ 用与校准独立的数据拟合【Prop. 1, 3】。
  4. 访问权限：score 只用预测残差，black-box 可用；ratio 估计只需无标签 target 协变量【§4】。
- **保证形式**：marginal coverage（对校准集与测试点联合取平均），finite-sample 的 conformal 部分加一个 TV 惩罚项。不是 conditional coverage，也不是 risk control。
- **粒度**：单步预测（一个 $(s,a)\to y$ 查询）。多步 occupancy shift 与联合轨迹覆盖明确留作 future work【§2.1, §9】。

## 2. Core insight
现有做法默认"换策略后世界模型要重新校准或重训" → 但转移核 $K$ 不变，变的只是查询分布 $X=(S,A)$，所以联合似然比是 $X$-可测的，且可由无标签 source/target 协变量的分类器识别 → 作者因此把校准度量为"相对部署分布"的量，用 weighted conformal 加 ratio 误差惩罚给出端到端覆盖界。

〔分析〕这个洞察本身是 Tibshirani et al. 2019 的 covariate shift 套到 policy intervention 的因果语言上（soft intervention，$d_t/d_b\cdot d\pi_t/d\pi_b$）。真正新的部分是误差传递链：classifier regret → ratio L1 → TV → coverage。其中 Lemma 4 的"在 source 律下积分使 $1-\eta$ 抵消"是一个小而干净的技巧。

## 3. Novelty delta
以下前作均依据原文 related work，未独立核实。

| 最相近的前作 | 它的做法 | 本文的差异 | 差异类型 |
|---|---|---|---|
| Weighted conformal under covariate shift (Tibshirani et al., 原文 ref 34) | 已知 / 估计的 ratio，精确 ratio 下有覆盖保证 | 给出估计 ratio 时的 TV / L1 覆盖惩罚，并接上 classifier regret | 新理论保证（增量） |
| Non-exchangeable / adaptive conformal (ref 2, 11) | 用权重或自适应处理偏离 exchangeability | 针对 policy intervention，用因果结构识别 ratio | 新问题设定（语境化） |
| Conformal counterfactual inference (ref 21) | 静态 treatment 的 propensity 加权 | 加上 state occupancy 因子，用于动力系统一步预测 | 新问题设定（窄） |
| Proper-loss 与 density ratio 的联系 (ref 23, 31, 3) | 分类概率与密度比的关系 | $(\rho\gamma)^{-1}$ 取代泛化 odds-map 的 $\gamma^{-2}$ | 新理论保证（常数级） |
| 世界模型 + conformal（refs 6, 30, 39） | 用 conformal 阈值做安全过滤、轨迹预测 | 在固定世界模型上显式按部署律重校准 | 工程组合 |

**判断**：偏增量。主要贡献是整合与干净的误差传递，TV 惩罚本身并不深。Appendix A 的 Wasserstein 反例（$W_2\to0$ 而 TV 不变）有澄清价值，Lean 形式化是少见的卖点。

## 4. Mechanism
1. 选定使 $P(Y|X)$ 稳定的 $X$（Algorithm 1 第 2 行）。
2. 用 source 与 target 的无标签协变量拟合 domain 后验 $h(x)=\Pr(D=1|X=x)$，令 $\widehat w_h=\frac{1-\rho}{\rho}\frac{h}{1-h}$（Eq. 7）。
3. 在 source 上计算 score $R_i=r_m(X_i,Y_i)$，不重训 $m$。
4. 对每个查询 $x$ 构造带测试点质量的加权经验测度（Eq. 3），取其 $(1-\alpha)$ 分位数 $q_{\widehat w}(x)$，输出 $\{y:r_m(x,y)\le q_{\widehat w}(x)\}$。

关键公式：
$$\mathbb P_Q\{Y\in\mathcal C_{\widehat w}\}\ge 1-\alpha-\mathrm{TV}(Q,\widehat Q),\quad \tfrac{d\widehat Q}{dP}=\tfrac{\widehat w}{\mathbb E_P\widehat w}\ \text{(Eq. 4–5)}$$
$$\mathbb E_{P_X}|w-\widehat w_h|=\tfrac1\rho\,\mathbb E_M\!\left[\tfrac{|\eta-h|}{1-h}\right]\le\tfrac{1}{\rho\gamma}\sqrt{\tfrac{\Delta_{\log}(h)}{2}}\ \text{(Eq. 9–10)}$$

## 5. Guarantees & assumptions
- **类型**：Eq. 5 对 conformal 部分是 finite-sample 的 marginal 保证，加一个确定性的 TV 惩罚；Eq. 10 依赖 population regret，是总体量【App. B.2】。
- **最脆弱的假设**：$P(Y|X)$ 不变；校准样本 iid（真实 Franka 数据来自 15 个 episode，同 episode 转移相关）；保证是对校准集随机性平均的 marginal。
- **多步 / 在线**：多步下 $d_t/d_b$ 需要 occupancy ratio；序列依赖直接破坏 exchangeability，Prop. 3 不再适用【§2.1, §9】。

## 6. Claim ↔ Evidence
| 作者的主要 claim | 支撑证据 | 证据强度 | 备注 |
|---|---|---|---|
| 策略偏移下 ordinary conformal 失效（90%→55.0%） | Table 1, Fig. 3, Table 3 | 中 | 偏移是在 192 点池上人为构造的倾斜，不是真实 policy 切换 |
| oracle / learned ratio 恢复目标覆盖（91.0% / 90.9%） | Table 1, Fig. 7 | 中 | logistic 模型对偏移"正确设定"，learned≈oracle 近乎必然【§5.2】 |
| clipping 以覆盖换 ESS（覆盖 90.9%→83.8%） | §6.3, Table 3 | 强 | 与 surrogate 论证一致；但仅一个 clip 阈值 |

## 7. Red flags & limitations
**作者已承认**：一步、marginal；需要共享条件动力学、support 包含；实验是 192 个转移上的受控倾斜【§9】。

**〔分析〕作者未充分讨论**：
- 校准与评估都从同一个 192 点池有放回抽样，很难暴露外推失败。
- 没有对比 nonexchangeable conformal、doubly-robust ratio 估计器或少量 target 标签的重校准。

## 8. Research hooks
1. **候选想法：RSI 门控的 ratio 重校准。** 自我改进后策略 $\pi_t$ 改变，原有 verifier / 置信度阈值在新 query 分布下失效；用 domain classifier 估计 ratio，对接受阈值做 weighted conformal。
2. **候选想法：多步 occupancy ratio 的 horizon 退化曲线。** 度量覆盖随 horizon $H$ 的衰减，并与轨迹级 importance weighting 对比。
3. **候选想法：把 TV 惩罚推广到 conformal risk control 的 selective risk。** 对有界单调损失，$\mathbb E_Q[\ell]\le\alpha+B\cdot\mathrm{TV}(Q,\widehat Q)$ 看起来成立（需要证明）。

## 9. 是否值得读原文
**选读。** 最该看 §3 Prop. 3 与 Eq. 4–6、§4 Lemma 4 的证明、Table 2 与 §6.3、Appendix A。实验部分可略读。

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw Object.assign(new Error(`${r.status} ${url}`), { status: r.status });
  return r.json();
}
async function send(url, body, method = "POST") {
  const r = await fetch(url, { method, cache: "no-store", headers: { "Content-Type": "application/json", "X-DailyPaper": "1" }, body: JSON.stringify(body ?? {}) });
  let data = {};
  try { data = await r.json(); } catch { /* 非 JSON 响应 */ }
  if (!r.ok) throw Object.assign(new Error(data.detail || `${r.status} ${url}`), { status: r.status });
  return data;
}

function revealAll(root = document) {
  if (reduced) return;
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("play"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
  $$(".reveal:not(.play)", root).forEach((el, i) => { el.style.animationDelay = (i % 4) * 70 + "ms"; io.observe(el); });
}
function countUp(el, n) {
  n = Number(n) || 0;
  if (reduced) { el.textContent = n.toLocaleString(); return; }
  const t0 = performance.now();
  const tick = (t) => { const p = Math.min((t - t0) / 1100, 1); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))).toLocaleString(); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

async function loadPaper(id) {
  const base = S.index.find((p) => p.id === id) || {};
  if (S.mode === "demo") return { ...base, markdown: id === "2610.35877" ? $("#demo-note").textContent : `# ${base.title}\n\n> **TL;DR** ${base.tldr}\n\n> **Core insight** ${base.core_insight}\n\n这是界面演示用的示例条目，没有完整精读笔记。` };
  try { return { ...base, ...(await getJSON(`${S.site}api/papers/${encodeURIComponent(id.replace(/\//g, "_"))}.json`)) }; } catch { /* 继续 */ }
  if (isLocal()) { const n = await getJSON(`/api/note/${encodeURIComponent(id)}`); return { ...base, ...n.frontmatter, markdown: n.markdown }; }
  throw new Error("找不到这篇论文的笔记");
}
function waitLibs() {
  return new Promise((res) => { const ok = () => window.marked && window.DOMPurify && window.katex; if (ok()) return res(true); let n = 0; const t = setInterval(() => { if (ok() || ++n > 60) { clearInterval(t); res(ok()); } }, 100); });
}
function renderMarkdown(md) {
  const math = [];
  const keep = (tex, display) => { math.push({ tex, display }); return `@@M${math.length - 1}@@`; };
  md = md.replace(/^---[\s\S]*?\n---\n/, "")
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keep(t, true))
    .replace(/\$(?!\s)([^$\n]+?)\$/g, (_, t) => keep(t, false))
    .replace(/〔分析〕/g, '<span class="tag-analysis">分析</span>')
    .replace(/【([^】\n]{1,80})】/g, '<span class="src">$1</span>');
  let html = DOMPurify.sanitize(marked.parse(md, { gfm: true }), { ADD_TAGS: ["details", "summary"] });
  html = html.replace(/@@M(\d+)@@/g, (_, i) => { const m = math[+i]; try { return katex.renderToString(m.tex, { displayMode: m.display, throwOnError: false }); } catch { return esc(m.tex); } });
  return html;
}

        <p>默认分类：<span class="mono">${esc(z?.default_collection || "DailyPaper/{topic_name}")}</span></p>
        <p>写入内容：条目、方向标签、PDF、精读笔记（子笔记）。需要 Zotero 桌面端保持打开。</p>
        <button class="btn" type="button" id="z-refresh">重新检测</button>
      </div>
      <div class="panel"><h3>其他入口</h3>
        <p>在 Obsidian 笔记里勾选 <span class="mono">zotero_approve</span> 也会被收集。</p>
        <button class="btn" type="button" data-tool="sync">从 Obsidian 收集并入库</button>
        <button class="btn" type="button" data-tool="profile">从 Zotero 导出兴趣画像</button>
        <p>兴趣画像用于个性化排序，并让已在文库里的论文不再出现。</p>
      </div>
      <div class="panel"><h3>同步审核结果</h3>
        <p>审核记录存在 <span class="mono">data/review_decisions.json</span>，推送后云端排序会参考你的反馈。</p>
        <button class="btn" type="button" data-tool="git/pull">拉取最新（git pull）</button>
        <button class="btn" type="button" data-tool="git/push">提交并推送</button>
      </div>
    </aside>
  </div>`;
};
VIEWS.review.after = (_, params) => {
  $$("[data-act]").forEach((b) => b.addEventListener("click", () => decide([b.dataset.id], b.dataset.act, $("#sel-collection").value)));
  $("#pick-all").addEventListener("click", () => { $$("[data-pick]").forEach((cb) => S.selected.add(cb.dataset.pick)); syncSelection(); });
  $("#z-refresh").addEventListener("click", async () => { await refreshZotero(); route(true); });
  $$("[data-tool]").forEach((b) => b.addEventListener("click", async () => {
    if (!isLocal()) { toast("需要在本地助手里使用（dailypaper app）", "err"); return; }
    b.disabled = true;
    try { const r = await send("/api/" + b.dataset.tool); (r.messages || ["完成"]).forEach((m) => toast(m, "ok")); await loadItems(); route(true); }
    catch (e) { toast("失败：" + e.message, "err"); } finally { b.disabled = false; }
  }));
};

/* ---------- 搜索设置 ---------- */
async function loadConfig() {
  if (isLocal()) {
    try { S.config = await getJSON("/api/config"); S.configSource = "api"; return; }
    catch (e) { S.configSource = e.status === 404 ? "missing" : "error"; }
  } else S.configSource = S.mode;
  S.config = structuredClone(DEMO_CONFIG);
}
function tagEditor(path, values, placeholder) {
  return `<div class="tags" data-tags="${path}">${values.map((v, i) => `<span class="chip">${esc(v)}<button type="button" data-rm="${i}" aria-label="删除 ${esc(v)}">×</button></span>`).join("")}<input type="text" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}"></div>`;
}
function topicCard(t, i) {
  return `<details class="tcard" ${i === 0 ? "open" : ""} data-topic-i="${i}">
    <summary><span class="chip dot t-${esc(t.id)}"></span><span class="grow"><b>${esc(t.name || "新方向")}</b><small>${esc(t.id)} · 权重 ${Number(t.weight).toFixed(1)} · ${t.keywords.length} 个关键词</small></span><span aria-hidden="true">▾</span></summary>
    <div class="tbody">
      <div class="two">
        <div class="field"><label for="t${i}-name">显示名</label><input type="text" id="t${i}-name" data-f="name" value="${esc(t.name)}"></div>
        <div class="field"><label for="t${i}-w">排序权重</label><div class="range"><input type="range" id="t${i}-w" data-f="weight" min="0.5" max="2" step="0.1" value="${esc(t.weight)}"><output>${Number(t.weight).toFixed(1)}</output></div></div>
      </div>
      <div class="field"><label for="t${i}-d">方向描述（给 LLM 看，越具体筛选越准）</label><textarea id="t${i}-d" rows="3" data-f="description">${esc(t.description)}</textarea></div>
      <div class="field"><span class="lab">强关键词（命中任意一个即进入预筛；* 为通配）</span>${tagEditor(`${i}.keywords`, t.keywords, "输入后回车")}</div>
      <div class="field"><span class="lab">语境词（非空时还需同时命中其中一个）</span>${tagEditor(`${i}.context`, t.context, "例如 agent*")}</div>
      <div class="field"><span class="lab">排除词</span>${tagEditor(`${i}.exclude`, t.exclude, "命中则排除")}</div>
      <div class="field"><label for="t${i}-l">镜头问题（每行一个，会拼进精读 prompt）</label><textarea id="t${i}-l" rows="4" data-f="lens_questions">${esc(t.lens_questions.join("\n"))}</textarea></div>
      <div><button class="btn sm bad" type="button" data-del-topic="${i}">删除这个方向</button></div>
    </div></details>`;
}
VIEWS.settings = async () => {
  await loadConfig();
  const c = S.config, d = c.daily;
  const canSave = S.configSource === "api" && c.editable !== false;
  const notice = { missing: "本地助手还没有提供 <code>/api/config</code>（见 src/dailypaper/app/API.md 2.2）。下面是项目 topics.yaml 的副本，可以编辑后导出 YAML 手动替换。", error: "读取配置失败，显示的是默认副本。", static: "这是只读网站。可以在这里编辑后导出 YAML，提交到仓库的 config/ 目录。", demo: "示例模式：编辑后可以导出 YAML。连接本地助手后可直接保存。" }[S.configSource];
  return `
  <div class="page-head"><h1>搜索设置</h1><p>决定每天抓什么、怎么筛、精读时问什么问题。保存后下一次运行生效。</p></div>
  ${notice ? `<div class="notice">${notice}</div>` : canSave ? "" : `<div class="notice">后端标记配置为不可写（editable: false），只能导出 YAML。</div>`}
  <div class="settings-layout">
    <div>
      <div class="section-head" style="margin-bottom:12px"><div><h2 style="font-size:22px">研究方向</h2></div><button class="btn sm" type="button" id="add-topic">＋ 新方向</button></div>
      <div id="topic-list">${c.topics.map(topicCard).join("")}</div>
    </div>
    <aside>
      <div class="panel"><h3>每日任务</h3>
        <div class="field"><span class="lab">arXiv 分类</span>${tagEditor("daily.categories", d.categories, "例如 cs.CV")}</div>
        <div class="two" style="margin-top:12px">
          <div class="field"><label for="d-k">精读篇数 Top K</label><input type="number" id="d-k" min="1" max="20" value="${esc(d.top_k)}"></div>
          <div class="field"><label for="d-max">预筛上限</label><input type="number" id="d-max" min="10" max="300" step="10" value="${esc(d.max_candidates)}"></div>
        </div>
        <div class="field" style="margin-top:12px"><label for="d-min">精读最低分（0–10）</label><div class="range"><input type="range" id="d-min" min="0" max="10" step="0.5" value="${esc(d.min_score)}"><output>${Number(d.min_score).toFixed(1)}</output></div></div>
        <button class="btn primary" type="button" id="save-config" ${canSave ? "" : "hidden"}>保存设置</button>
        <button class="btn" type="button" id="export-yaml">导出 topics.yaml</button>
      </div>
      <div class="panel"><h3>运行</h3>
        <p id="run-state">—</p>
        <button class="btn primary" type="button" id="run-daily">立即运行今日任务</button>
        <div class="field" style="margin-top:12px"><label for="read-ids">精读指定论文（arXiv ID，空格分隔）</label><input type="text" id="read-ids" placeholder="2610.35877 2610.01234"></div>
        <button class="btn" type="button" id="run-read">精读这些论文</button>
        <div class="log" id="run-log" style="margin-top:12px">（暂无日志）</div>
      </div>
    </aside>
  </div>`;
};
function readSettingsForm() {
  const c = S.config;
  $$("[data-topic-i]").forEach((card) => {
    const t = c.topics[+card.dataset.topicI];
    $$("[data-f]", card).forEach((el) => {
      const f = el.dataset.f;
      t[f] = f === "weight" ? Number(el.value) : f === "lens_questions" ? el.value.split("\n").map((s) => s.trim()).filter(Boolean) : el.value;
    });
  });
  c.daily.top_k = Number($("#d-k").value); c.daily.max_candidates = Number($("#d-max").value); c.daily.min_score = Number($("#d-min").value);
}
function getPath(path) { const [a, b] = path.split("."); return a === "daily" ? S.config.daily[b] : S.config.topics[+a][b]; }
function toYAML(c) {
  const q = (s) => /^[\w./*-][\w ./*'-]*$/.test(s) && !/^(true|false|null|yes|no)$/i.test(s) ? s : JSON.stringify(s);
  const list = (arr) => `[${arr.map(q).join(", ")}]`;
  let y = "# 由 DailyPaper 网页导出。替换 config/topics.yaml 即可。\n\ntopics:\n";
  for (const t of c.topics) {
    y += `  - id: ${t.id}\n    name: ${q(t.name)}\n    weight: ${t.weight}\n    description: >\n      ${t.description.replace(/\n+/g, " ")}\n`;
    y += `    keywords:\n${t.keywords.map((k) => `      - ${q(k)}`).join("\n") || "      []"}\n    context: ${list(t.context)}\n    exclude: ${list(t.exclude)}\n`;
    y += `    lens_questions:\n${t.lens_questions.map((l) => `      - ${JSON.stringify(l)}`).join("\n") || "      []"}\n\n`;
  }
  y += `# pipeline.yaml → pipelines.daily 中对应的参数：\n#   categories: ${list(c.daily.categories)}\n#   max_candidates: ${c.daily.max_candidates}\n#   top_k: ${c.daily.top_k}\n#   min_score: ${c.daily.min_score}\n`;
  return y;
}
VIEWS.settings.after = () => {
  const list = $("#topic-list");
  const bindRanges = (root) => $$('input[type="range"]', root).forEach((r) => r.addEventListener("input", () => (r.nextElementSibling.value = Number(r.value).toFixed(1))));
  bindRanges(document);
  document.addEventListener("keydown", tagKeys);
  $("#view").addEventListener("click", tagClicks);
  $("#add-topic").addEventListener("click", () => {
    readSettingsForm();
    const n = S.config.topics.length + 1;
    S.config.topics.push({ id: `topic_${n}`, name: "新方向", weight: 1, description: "", keywords: [], context: [], exclude: [], lens_questions: [] });
    list.innerHTML = S.config.topics.map(topicCard).join(""); bindRanges(list);
    $$("details", list).forEach((d, i) => (d.open = i === S.config.topics.length - 1));
  });
  list.addEventListener("click", (e) => {
    const del = e.target.closest("[data-del-topic]"); if (!del) return;
    readSettingsForm(); S.config.topics.splice(+del.dataset.delTopic, 1);
    list.innerHTML = S.config.topics.map(topicCard).join(""); bindRanges(list);
  });
  $("#export-yaml").addEventListener("click", () => {
    readSettingsForm();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([toYAML(S.config)], { type: "text/yaml;charset=utf-8" })); a.download = "topics.yaml"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  $("#save-config")?.addEventListener("click", async (e) => {
    readSettingsForm(); e.currentTarget.disabled = true;
    try { const { editable, ...body } = S.config; const r = await send("/api/config", body, "PUT"); (r.messages || ["已保存"]).forEach((m) => toast(m, "ok")); }
    catch (err) { toast("保存失败：" + err.message, "err"); } finally { e.currentTarget.disabled = false; }
  });
  $("#run-daily").addEventListener("click", () => startRun("daily"));
  $("#run-read").addEventListener("click", () => {
    const ids = $("#read-ids").value.split(/[\s,]+/).map((s) => s.match(ARXIV_ID)?.[1]).filter(Boolean);
    ids.length ? startRun("read", ids) : toast("请输入 arXiv ID，例如 2610.35877", "err");
  });
  paintRun();
};
function tagKeys(e) {
  const input = e.target.closest?.(".tags input"); if (!input || !(e.key === "Enter" || e.key === ",")) return;
  e.preventDefault();
  const v = input.value.trim().replace(/,$/, ""); if (!v) return;
  readSettingsForm();
  const box = input.closest("[data-tags]"); const arr = getPath(box.dataset.tags);
  if (!arr.includes(v)) arr.push(v);
  box.outerHTML = tagEditor(box.dataset.tags, arr, input.placeholder);
  $(`[data-tags="${box.dataset.tags}"] input`).focus();
}
function tagClicks(e) {
  const rm = e.target.closest?.("[data-rm]"); if (!rm) return;
  const box = rm.closest("[data-tags]"); const arr = getPath(box.dataset.tags);
  arr.splice(+rm.dataset.rm, 1);
  const ph = $("input", box).placeholder; box.outerHTML = tagEditor(box.dataset.tags, arr, ph);
}

/* ======================================================================
   路由
   ====================================================================== */
let lastKey = "";
async function route(force = false) {
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const [name = "", arg = ""] = path.split("/").map(decodeURIComponent);
  const key = path + "?" + (qs || "");
  if (!["", "daily", "library", "paper", "review", "settings"].includes(name)) return; // 页内锚点，例如 #how
  if (key === lastKey && !force) return;
  lastKey = key;
  document.removeEventListener("keydown", tagKeys);
  $("#view").removeEventListener("click", tagClicks);
  const view = name || "home"; const params = new URLSearchParams(qs || "");
  $$("[data-nav]").forEach((a) => { if (a.dataset.nav === (view === "paper" ? "library" : view)) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const root = $("#view");
  try {
    const html = await VIEWS[view](arg, params);
    root.innerHTML = `<div class="view">${html}</div>`;
    if (!force) window.scrollTo({ top: 0, behavior: "auto" });
    await VIEWS[view].after?.(arg, params);
    revealAll(root); syncSelection();
    document.title = { home: "DailyPaper", daily: "今日 · DailyPaper", library: "文库 · DailyPaper", paper: "论文 · DailyPaper", review: "审核台 · DailyPaper", settings: "搜索设置 · DailyPaper" }[view];
  } catch (e) {
    root.innerHTML = `<div class="view"><div class="page-head"><h1>出错了</h1><p>${esc(e.message)}</p></div><a class="btn" href="#/">回到首页</a></div>`;
  }
}

/* ---------- 全局事件 ---------- */
document.addEventListener("change", (e) => {
  const cb = e.target.closest?.("[data-pick]"); if (!cb) return;
  cb.checked ? S.selected.add(cb.dataset.pick) : S.selected.delete(cb.dataset.pick);
  syncSelection();
});
$$("[data-bulk]").forEach((b) => b.addEventListener("click", () => decide([...S.selected], b.dataset.bulk, $("#sel-collection").value)));
$("#sel-clear").addEventListener("click", () => { S.selected.clear(); syncSelection(); });
$("#run-now").addEventListener("click", () => startRun("daily"));
addEventListener("hashchange", () => route());
boot();
</script>
