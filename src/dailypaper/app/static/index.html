<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DailyPaper 审核</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e4e0;
  --accent: #2f6fed; --ok: #1f8a4c; --warn: #b7791f; --bad: #c0392b; --chip: #eef1f6; --chip-on: #dbe6ff;
  --code: #f1f1ef;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151517; --panel: #1e1e21; --text: #ececee; --muted: #9a9aa2; --line: #2e2e33;
          --accent: #6e9bff; --ok: #4cc27f; --warn: #e0a84a; --bad: #ef6b5b; --chip: #2a2a30; --chip-on: #2c3f6e;
          --code: #26262b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row + .row { margin-top: 8px; }
h1 { font-size: 17px; margin: 0 10px 0 0; }
.status { font-size: 13px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
main { max-width: 1000px; margin: 0 auto; padding: 16px; }
.btn, .tab, .chip-btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13.5px; line-height: 1.5; }
.btn:hover, .chip-btn:hover { border-color: var(--accent); }
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.tab .n { opacity: .7; font-size: 12px; margin-left: 3px; }
.btn.ok { color: var(--ok); } .btn.warn { color: var(--warn); } .btn.bad { color: var(--bad); }
.btn.primary { background: var(--ok); color: #fff; border-color: var(--ok); }
.chip-btn { background: var(--chip); border-color: transparent; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
.chip-btn.on { background: var(--chip-on); color: var(--accent); font-weight: 600; }
.label { font-size: 12.5px; color: var(--muted); margin-right: 2px; }
.sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
select, input[type=search] { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 4px 8px; font-size: 13.5px; }
input[type=search] { width: 220px; }
.right { margin-left: auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.card h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.4; }
.card h3 a { color: var(--text); text-decoration: none; } .card h3 a:hover { color: var(--accent); }
.meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.stars { color: #e3a008; letter-spacing: 1px; }
.field { margin: 8px 0 0; display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
.field b { color: var(--muted); font-weight: 600; font-size: 13px; padding-top: 1px; }
.field .md p { margin: 0; } .field .md p + p { margin-top: 4px; }
.md code { background: var(--code); border-radius: 4px; padding: 0 4px; font-size: 90%; }
.actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 12px; border-radius: 6px; padding: 1px 8px; border: 1px solid var(--line); }
.badge.imported { color: var(--ok); border-color: var(--ok); } .badge.rejected { color: var(--bad); border-color: var(--bad); }
.badge.approved, .badge.later { color: var(--warn); border-color: var(--warn); } .badge.failed { color: var(--bad); }
.note { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; overflow-x: auto; font-size: 14.5px; }
.note h2 { font-size: 16px; margin: 18px 0 6px; } .note h3 { font-size: 15px; }
.note table { border-collapse: collapse; font-size: 13px; } .note td, .note th { border: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
.note pre { white-space: pre-wrap; background: var(--code); padding: 8px; border-radius: 6px; }
.note blockquote { margin: 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
#log { position: fixed; right: 16px; bottom: 16px; max-width: 460px; z-index: 10; }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 8px 12px; margin-top: 8px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: pre-wrap; }
.empty { text-align: center; color: var(--muted); padding: 48px 0; }
.count { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
@media (max-width: 640px) { .right { margin-left: 0; } input[type=search] { width: 100%; } .field { grid-template-columns: 1fr; gap: 2px; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1 id="title">DailyPaper 审核</h1>
    <span class="status" id="zstatus"><span class="dot"></span>正在连接 Zotero…</span>
    <span class="right row">
      <button class="btn" onclick="act('/api/git/pull')" title="从 GitHub 拉取云端最新的日报和队列">⟳ 拉取最新</button>
      <button class="btn" onclick="act('/api/sync')" title="把已批准（含 Obsidian 中勾选）的论文写入 Zotero">⇪ 同步到 Zotero</button>
      <button class="btn" onclick="act('/api/profile')" title="从 Zotero 文库导出去重索引和兴趣画像">☰ 更新兴趣画像</button>
      <button class="btn" onclick="act('/api/git/push')" title="提交并推送审核结果">⇧ 推送审核结果</button>
    </span>
  </div>
  <div class="row">
    <span id="tabs" class="row"></span>
    <span class="right row">
      <input type="search" id="q" placeholder="搜索标题 / TL;DR" oninput="render()">
      <label class="label">排序</label>
      <select id="sort" onchange="render()">
        <option value="date">日期</option>
        <option value="score">排序分</option>
        <option value="value">价值</option>
      </select>
    </span>
  </div>
  <div class="row">
    <span class="label">方向</span><span id="f-topic" class="row"></span>
    <span class="sep"></span>
    <span class="label">类型</span><span id="f-type" class="row"></span>
    <span class="sep"></span>
    <span class="label">价值 ≥</span><span id="f-value" class="row"></span>
    <button class="chip-btn" id="clear" onclick="clearFilters()" hidden>✕ 清除筛选</button>
  </div>
  <div class="row">
    <label class="label"><input type="checkbox" id="checkall" onchange="toggleAll(this.checked)"> 全选可见</label>
    <label class="label">放入分类</label>
    <select id="collection"></select>
    <span class="right row">
      <button class="btn primary" onclick="bulk('approve')">✅ 批量加入 Zotero</button>
      <button class="btn warn" onclick="bulk('later')">⏸ 批量稍后</button>
      <button class="btn bad" onclick="bulk('reject')">❌ 批量不要</button>
    </span>
  </div>
</header>
<main>
  <p class="count" id="count"></p>
  <div id="list"><div class="empty">加载中…</div></div>
</main>
<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script>
const TABS = [["pending","待审核"],["approved","已批准"],["later","稍后"],["imported","已入库"],["rejected","不要"],["","全部"]];
const STATUS_TEXT = {pending:"待审核", approved:"已批准（待入库）", later:"稍后", rejected:"不要", imported:"已入库", failed:"失败"};
const TYPE_TEXT = {method:"方法", theory:"理论", benchmark:"Benchmark", empirical:"实证", survey:"综述", position:"观点"};
let meta = {topics: [], paper_types: [], counts: {}};
let topicName = {};
let current = "pending";
let items = [];
const filter = {topics: new Set(), types: new Set(), value: 0};

// ---------- 工具
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function stars(n) { return n ? "★".repeat(n) + "☆".repeat(5 - n) : "—"; }
function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  document.getElementById("log").appendChild(el); setTimeout(() => el.remove(), 9000);
}
async function api(url, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json", "X-DailyPaper": "1"}, body: JSON.stringify(body)};
  const r = await fetch(url, opt);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}
async function act(url) {
  toast("处理中…");
  try { (await api(url, {})).messages.forEach(toast); } catch (e) { toast("出错：" + e.message); }
  load();
}

// ---------- Markdown + 公式：先把公式换成占位符，渲染 Markdown 后再用 KaTeX 还原
function renderMd(md, inline) {
  const math = [];
  const keep = (tex, display) => { math.push([tex, display]); return `@@MATH${math.length - 1}@@`; };
  md = String(md ?? "")
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keep(t, true))
    .replace(/\$([^\n$]+?)\$/g, (_, t) => keep(t, false));
  let html = inline ? marked.parseInline(md) : marked.parse(md);
  return html.replace(/@@MATH(\d+)@@/g, (_, i) => {
    const [tex, display] = math[+i];
    if (!window.katex) return esc(display ? `$$${tex}$$` : `$${tex}$`);
    try { return katex.renderToString(tex, {displayMode: display, throwOnError: false}); }
    catch (e) { return esc(tex); }
  });
}

// ---------- 筛选栏
function chip(id, text, on, onclick, title) {
  return `<button class="chip-btn ${on ? "on" : ""}" onclick="${onclick}" title="${esc(title || "")}">${esc(text)}</button>`;
}
function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, v]) => {
    const n = k ? (meta.counts[k] || 0) : Object.values(meta.counts).reduce((a, b) => a + b, 0);
    return `<button class="tab ${k === current ? "active" : ""}" onclick="current='${k}';load()">${v}<span class="n">${n}</span></button>`;
  }).join("");
}
function renderFilters() {
  const present = new Set(items.flatMap(i => i.entry.topics));
  document.getElementById("f-topic").innerHTML = meta.topics
    .map(t => chip(t.id, t.name, filter.topics.has(t.id), `toggle('topics','${t.id}')`, present.has(t.id) ? "" : "当前列表中没有这个方向的论文"))
    .join("");
  document.getElementById("f-type").innerHTML = meta.paper_types
    .map(t => chip(t, TYPE_TEXT[t] || t, filter.types.has(t), `toggle('types','${t}')`)).join("");
  document.getElementById("f-value").innerHTML = [5, 4, 3, 2, 1]
    .map(v => chip(v, "★".repeat(v), filter.value === v, `setValue(${v})`)).join("");
  document.getElementById("clear").hidden = !(filter.topics.size || filter.types.size || filter.value);
}
function toggle(kind, v) { const s = filter[kind]; s.has(v) ? s.delete(v) : s.add(v); render(); }
function setValue(v) { filter.value = filter.value === v ? 0 : v; render(); }
function clearFilters() { filter.topics.clear(); filter.types.clear(); filter.value = 0; document.getElementById("q").value = ""; render(); }

// ---------- 列表
function visible() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const sort = document.getElementById("sort").value;
  let out = items.filter(({entry: e}) =>
    (!filter.topics.size || e.topics.some(t => filter.topics.has(t))) &&
    (!filter.types.size || filter.types.has(e.paper_type)) &&
    (e.value_score >= filter.value) &&
    (!q || (e.title + " " + e.tldr + " " + e.core_insight).toLowerCase().includes(q)));
  const key = {date: e => e.date + e.score, score: e => e.score, value: e => e.value_score * 100 + e.score}[sort];
  return out.sort((a, b) => key(b.entry) > key(a.entry) ? 1 : key(b.entry) < key(a.entry) ? -1 : 0);
}
function card(it) {
  const e = it.entry, d = it.decision;
  const topics = e.topics.map(t => chip(t, topicName[t] || t, filter.topics.has(t), `toggle('topics','${t}')`, "按此方向筛选")).join("");
  const type = e.paper_type ? chip(e.paper_type, TYPE_TEXT[e.paper_type] || e.paper_type, filter.types.has(e.paper_type), `toggle('types','${e.paper_type}')`, "按此类型筛选") : "";
  const pending = ["pending", "later", "approved", "failed"].includes(d.status);
  const field = (label, md) => md ? `<div class="field"><b>${label}</b><div class="md">${renderMd(md, true)}</div></div>` : "";
  return `<div class="card" id="c-${esc(e.id)}">
    <div class="row" style="align-items:flex-start;flex-wrap:nowrap">
      <input type="checkbox" class="pick" value="${esc(e.id)}" style="margin-top:5px">
      <div style="flex:1;min-width:0">
        <h3><a href="${esc(e.url_abs)}" target="_blank" rel="noopener">${esc(e.title)}</a></h3>
        <div class="meta">
          <span class="stars" title="对你研究方向的价值">${stars(e.value_score)}</span>
          ${topics}${type}
          <span>${esc(e.date)}</span><span>排序分 ${e.score}</span>
          <span class="badge ${d.status}">${STATUS_TEXT[d.status] || d.status}</span>
          ${d.citekey ? `<code>@${esc(d.citekey)}</code>` : ""}
          ${d.zotero_key ? `<a href="zotero://select/library/items/${esc(d.zotero_key)}">在 Zotero 中打开</a>` : ""}
        </div>
        ${field("TL;DR", e.tldr)}
        ${field("Insight", e.core_insight)}
        ${field("读不读", e.worth_reading)}
        ${d.error ? `<div class="field" style="color:var(--bad)"><b>入库失败</b><div>${esc(d.error)}</div></div>` : ""}
        <div class="actions">
          ${pending ? `<button class="btn primary" onclick="decide(['${esc(e.id)}'],'approve')">✅ 加入 Zotero</button>` : ""}
          ${d.status !== "later" && d.status !== "imported" ? `<button class="btn warn" onclick="decide(['${esc(e.id)}'],'later')">⏸ 稍后</button>` : ""}
          ${d.status !== "rejected" && d.status !== "imported" ? `<button class="btn bad" onclick="decide(['${esc(e.id)}'],'reject')">❌ 不要</button>` : ""}
          ${d.status === "rejected" ? `<button class="btn" onclick="decide(['${esc(e.id)}'],'pending')">↺ 撤销</button>` : ""}
          <button class="btn" onclick="toggleNote('${esc(e.id)}')">📖 精读笔记</button>
          ${e.url_pdf ? `<a class="btn" href="${esc(e.url_pdf)}" target="_blank" rel="noopener">PDF</a>` : ""}
        </div>
        <div class="note" id="n-${esc(e.id)}" hidden></div>
      </div>
    </div>
  </div>`;
}
function render() {
  renderFilters();
  const open = new Set([...document.querySelectorAll(".note:not([hidden])")].map(n => n.id.slice(2)));
  const shown = visible();
  document.getElementById("count").textContent = shown.length === items.length ? `${items.length} 篇` : `显示 ${shown.length} / ${items.length} 篇`;
  document.getElementById("list").innerHTML = shown.length ? shown.map(card).join("") : `<div class="empty">没有符合条件的论文。</div>`;
  document.getElementById("checkall").checked = false;
  open.forEach(id => toggleNote(id));
}
async function load() {
  try { meta = await api("/api/meta"); topicName = Object.fromEntries(meta.topics.map(t => [t.id, t.name])); } catch (e) {}
  renderTabs();
  items = await api("/api/items?status=" + encodeURIComponent(current));
  render();
}

// ---------- 操作
async function decide(ids, action) {
  const collection = document.getElementById("collection").value;
  try { localStorage.setItem("dp.collection", collection); } catch (e) {}
  if (action === "approve") toast(`正在写入 Zotero（${ids.length} 篇）…`);
  try { (await api("/api/decide", {ids, action, collection})).messages.forEach(toast); }
  catch (e) { toast("出错：" + e.message); }
  load();
}
function picked() { return [...document.querySelectorAll(".pick:checked")].map(x => x.value); }
function toggleAll(v) { document.querySelectorAll(".pick").forEach(x => x.checked = v); }
function bulk(action) { const ids = picked(); if (!ids.length) return toast("请先勾选论文"); decide(ids, action); }
async function toggleNote(id) {
  const el = document.getElementById("n-" + id);
  if (!el) return;
  if (!el.hidden) { el.hidden = true; return; }
  el.hidden = false; el.textContent = "加载中…";
  try {
    const {markdown} = await api("/api/note/" + encodeURIComponent(id));
    el.innerHTML = renderMd(markdown, false);
  } catch (e) { el.textContent = e.message; }
}
async function zstatus() {
  const el = document.getElementById("zstatus"), sel = document.getElementById("collection");
  try {
    const s = await api("/api/zotero/status");
    el.innerHTML = `<span class="dot ${s.ok ? "ok" : "bad"}"></span>${esc(s.message)}`;
    let saved = ""; try { saved = localStorage.getItem("dp.collection") || ""; } catch (e) {}
    const opts = [["", `默认：${s.default_collection || "文库根目录"}`], ...s.collections.map(c => [c, c])];
    sel.innerHTML = opts.map(([v, t]) => `<option value="${esc(v)}" ${v === saved ? "selected" : ""}>${esc(t)}</option>`).join("");
  } catch (e) { el.innerHTML = `<span class="dot bad"></span>${esc(e.message)}`; }
}
zstatus(); load();
</script>
</body>
</html>
