<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
/* Layout: a misty-fjord reading room. One framed photographic hero with drifting fog,
   then deep-teal panels of frosted glass; every view lives in the same shell. Single committed dark-teal look. */
:root{
  color-scheme:dark;
  --bg:#0C232B; --bg-2:#0F2C35; --panel:#12343F; --panel-2:#174150;
  --ink:#F2F7F8; --body:#BCD0D6; --muted:#8CA7AF;
  --mist:#EEF5F6; --accent:#A9DCE1;
  --line:rgba(214,232,237,.15); --line-2:rgba(214,232,237,.30);
  --glass:rgba(206,226,232,.10); --glass-2:rgba(206,226,232,.17); --glass-dark:rgba(9,29,36,.55);
  --ok:#93D7B0; --warn:#EBC983; --bad:#EFA195;
  --sans:Manrope,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
}
/* 白天模式：同一套变量换成浅色；封面照片区域保持深色 */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EEF3F4; --bg-2:#E4EBEC; --panel:#FFFFFF; --panel-2:#F4F8F9;
  --ink:#10272E; --body:#2F4A52; --muted:#5F7B84;
  --mist:#10272E; --accent:#1B7A86;
  --line:rgba(16,39,46,.12); --line-2:rgba(16,39,46,.24);
  --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.92); --glass-dark:rgba(255,255,255,.75);
  --ok:#1E7F4F; --warn:#9A6B12; --bad:#B23A2E;
  --code:rgba(16,39,46,.07);
}
:root{--code:rgba(9,30,38,.5)}
:root[data-theme="light"] body{background-image:radial-gradient(1200px 600px at 85% -10%,rgba(27,122,134,.10),transparent 60%),radial-gradient(900px 500px at -10% 40%,rgba(27,122,134,.06),transparent 60%)}
:root[data-theme="light"] .nav-bar{background:rgba(255,255,255,.72)}
:root[data-theme="light"] .btn.primary{background:#10272E;color:#fff}
:root[data-theme="light"] .btn.primary:hover{background:#1B3A43}
:root[data-theme="light"] .filter[aria-pressed="true"],:root[data-theme="light"] .datebar a[aria-current="date"]{background:#10272E;color:#fff}
:root[data-theme="light"] .datebar a[aria-current="date"] b,:root[data-theme="light"] .datebar a[aria-current="date"] small{color:#fff}
:root[data-theme="light"] .insight{background:rgba(27,122,134,.08);color:var(--body)}
:root[data-theme="light"] th{background:rgba(16,39,46,.04)}
:root[data-theme="light"] .input,:root[data-theme="light"] input[type=text],:root[data-theme="light"] input[type=number],:root[data-theme="light"] textarea,:root[data-theme="light"] select{background:#fff}
:root[data-theme="light"] .tag-analysis{color:#fff}
:root[data-theme="light"] .pick span{background:rgba(255,255,255,.7)}
:root[data-theme="light"] .pick input:checked+span:after{border-color:#fff}
:root[data-theme="light"] .hero,:root[data-theme="light"] .paper-head{color:#EEF5F6}
:root[data-theme="light"] .paper-head h1,:root[data-theme="light"] .paper-head .meta-line,:root[data-theme="light"] .paper-head .chip{color:#EEF5F6}
:root[data-theme="light"] .paper-head .btn{color:#EEF5F6;border-color:rgba(238,245,246,.4)}
:root[data-theme="light"] .paper-head .btn.primary{background:#EEF5F6;color:#10272E}
:root[data-theme="light"] .hero .btn{color:#EEF5F6}:root[data-theme="light"] .hero .btn.primary{background:#EEF5F6;color:#10272E}
:root[data-theme="light"] .search-chips .chip,:root[data-theme="light"] .hero .eyebrow,:root[data-theme="light"] .float-card{color:#EEF5F6}
:root[data-theme="light"] .float-card h3{color:#fff}
#theme-toggle .moon{display:none}:root[data-theme="light"] #theme-toggle .sun{display:none}:root[data-theme="light"] #theme-toggle .moon{display:inline}
.btn.icon{min-width:36px;padding:4px 10px;font-size:16px;line-height:1}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--body);font:var(--fs,15px)/var(--lh,1.7) var(--sans);overflow-x:clip;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 85% -10%,rgba(169,220,225,.10),transparent 60%),radial-gradient(900px 500px at -10% 40%,rgba(120,170,185,.08),transparent 60%);background-attachment:fixed}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.mono{font-family:var(--mono)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{color:var(--ink);text-wrap:balance;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--glass);color:var(--ink);font-weight:600;font-size:14px;transition:transform .18s,background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:var(--glass-2);border-color:rgba(214,232,237,.45)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--mist);color:#0C232B;border-color:transparent;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.btn.primary:hover{background:#fff;box-shadow:0 8px 28px rgba(169,220,225,.25)}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:4px 13px;font-size:13px}
.btn.ok{border-color:rgba(147,215,176,.5);color:var(--ok)}.btn.bad{border-color:rgba(239,161,149,.45);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:12px;color:var(--body);white-space:nowrap}
.chip.t-llm_uq{border-color:rgba(169,220,225,.45)}.chip.t-agent_uq{border-color:rgba(147,215,176,.45)}.chip.t-conformal_selective{border-color:rgba(235,201,131,.5)}.chip.t-agent_rsi{border-color:rgba(190,170,240,.5)}.chip.t-multiagent_trust{border-color:rgba(239,161,149,.5)}
.chip.dot:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.filter{cursor:pointer}.filter[aria-pressed="true"]{background:var(--mist);color:#0C232B;border-color:transparent}
.stars{color:var(--warn);letter-spacing:2px;font-size:13px}
.status{font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--line)}
.s-pending{color:var(--accent)}.s-approved{color:var(--warn);border-color:rgba(235,201,131,.4)}.s-imported{color:var(--ok);border-color:rgba(147,215,176,.4)}.s-later{color:var(--muted)}.s-rejected{color:var(--bad);border-color:rgba(239,161,149,.35)}.s-failed{color:var(--bad);border-color:var(--bad)}

/* ---------- nav ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:20;margin-top:12px}
.nav-bar{display:flex;align-items:center;gap:18px;padding:8px 10px 8px 18px;border-radius:999px;border:1px solid var(--line-2);background:rgba(12,35,43,.55);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 10px 40px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);font-size:18px;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.links{display:flex;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{padding:6px 14px;border-radius:999px;color:var(--muted);font-size:14px;white-space:nowrap;transition:color .2s,background .2s}
.links a:hover{color:var(--ink)}.links a[aria-current="page"]{color:var(--ink);background:var(--glass-2)}
.links .badge{font-size:11px;margin-left:5px;padding:0 6px;border-radius:999px;background:var(--warn);color:#0C232B;font-weight:700}
.mode{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:5px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.mode.local i{background:var(--ok);box-shadow:0 0 8px var(--ok)}.mode.static i{background:var(--accent)}.mode.demo i{background:var(--warn)}
.nav-end{display:flex;align-items:center;gap:8px}

/* ---------- views ---------- */
main{min-height:60vh}
.view{animation:viewIn .45s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:.7;transform:translateY(10px)}to{opacity:1;transform:none}}
.section{padding-block:56px 8px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.section-head h2{font-size:clamp(24px,3vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.section-head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.page-head{padding-block:40px 6px}
.page-head h1{font-size:clamp(30px,4vw,46px);letter-spacing:-.025em;line-height:1.15;font-weight:700}
.page-head p{color:var(--muted);margin:8px 0 0;max-width:62ch}
.reveal.play{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:.6;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- hero ---------- */
.hero{position:relative;margin-top:-64px;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.hero-stage{position:relative;isolation:isolate;overflow:hidden}
.hero-photo{position:absolute;inset:0;z-index:-3;overflow:hidden}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 58%;transform-origin:55% 60%;animation:kenburns 42s ease-in-out infinite alternate;will-change:transform}
@keyframes kenburns{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.13) translate(-1.2%,-1.5%)}}
.hero-shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(95deg,rgba(9,30,38,.78) 0%,rgba(9,30,38,.44) 46%,rgba(9,30,38,.08) 78%),linear-gradient(180deg,rgba(9,30,38,.28) 0%,transparent 40%,rgba(9,30,38,.62) 100%)}
/* 跟随鼠标的暖色光斑：晨光打在玻璃上的感觉 */
.glare{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .6s;mix-blend-mode:screen;
  background:radial-gradient(560px circle at var(--mx,70%) var(--my,45%),rgba(255,214,190,.26),rgba(255,214,190,.08) 35%,transparent 62%)}
.hero-stage:hover .glare{opacity:1}
.fog{position:absolute;inset:-20% -40%;z-index:-1;pointer-events:none;filter:blur(24px);mix-blend-mode:screen;opacity:.45;
  background:radial-gradient(28% 18% at 22% 78%,rgba(240,248,250,.38),transparent 70%),radial-gradient(30% 16% at 64% 84%,rgba(240,248,250,.30),transparent 70%),radial-gradient(22% 14% at 90% 70%,rgba(240,248,250,.24),transparent 70%);
  animation:fog 46s linear infinite alternate}
.fog.f2{opacity:.3;animation-duration:70s;animation-direction:alternate-reverse;background:radial-gradient(26% 15% at 40% 72%,rgba(240,248,250,.32),transparent 70%),radial-gradient(24% 12% at 80% 90%,rgba(240,248,250,.26),transparent 70%)}
@keyframes fog{from{transform:translate3d(-9%,0,0)}to{transform:translate3d(9%,-2%,0)}}
.hero-inner{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;padding:116px 48px 236px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;color:var(--mist);padding:5px 13px;border-radius:999px;background:rgba(238,245,246,.12);border:1px solid rgba(243,183,166,.45);backdrop-filter:blur(8px)}
/* 动态玻璃：边缘高光 + 缓慢扫过的反光 */
.glass{position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.25)}
.glass:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.16) 46%,rgba(255,228,214,.22) 50%,rgba(255,255,255,.14) 54%,transparent 65%);
  background-size:260% 100%;animation:sheen 11s cubic-bezier(.4,0,.2,1) infinite}
.glass>*{position:relative;z-index:2}
@keyframes sheen{0%{background-position:120% 0}55%,100%{background-position:-120% 0}}
.tilt{transform:perspective(900px) rotateX(var(--ry,0deg)) rotateY(var(--rx,0deg)) translateZ(0);transition:transform .25s ease-out;will-change:transform}
.hero h1{font-size:clamp(36px,5.4vw,68px);line-height:1.08;letter-spacing:-.03em;font-weight:700;margin:20px 0 14px;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.18)}
.hero .sub{color:rgba(238,245,246,.86);font-size:17px;margin:0 0 26px;max-width:40ch}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.float-card{justify-self:end;width:min(380px,100%);padding:14px;border-radius:22px;background:rgba(238,245,246,.14);border:1px solid rgba(238,245,246,.3);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);color:var(--mist)}
.float-card .thumb{height:132px;border-radius:14px;background:linear-gradient(160deg,rgba(9,30,38,.1),rgba(9,30,38,.6)),url(assets/hero-sunrise-640.jpg) center 62%/cover;display:flex;align-items:flex-end;padding:10px;font-size:11px;letter-spacing:.06em}
.float-card h3{font-size:17.5px;line-height:1.35;margin:12px 4px 8px;color:#fff}
.float-card p{margin:0 4px 10px;font-size:13.5px;line-height:1.6;color:rgba(238,245,246,.8);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.float-card a{display:inline-flex;gap:6px;margin:0 4px 4px;font-size:13px;border-bottom:1px solid rgba(238,245,246,.4)}
.searchbox{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(860px,calc(100% - 48px));padding:14px;border-radius:22px;background:rgba(238,245,246,.14);border:1px solid rgba(238,245,246,.3);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.searchbox.glass:before{animation-delay:-5s}
.search-row{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 20px;border-radius:999px;background:rgba(9,30,38,.38);border:1px solid rgba(238,245,246,.2)}
.search-row input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:16px;line-height:1.5}
.search-row input::placeholder{color:rgba(238,245,246,.6)}
.go{width:42px;height:42px;border-radius:50%;border:0;background:var(--mist);color:#0C232B;display:grid;place-items:center;flex:none}
.search-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.search-chips .chip{background:rgba(9,30,38,.3);border-color:rgba(238,245,246,.25);color:var(--mist);cursor:pointer}
.search-chips .chip:hover{background:rgba(238,245,246,.2)}
.search-hint{margin:8px 6px 0;font-size:12px;color:var(--mist);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.band{display:grid;grid-template-columns:1.1fr 1fr auto;gap:28px;align-items:center;padding:30px 48px;background:var(--bg-2);border-top:1px solid var(--line)}
.band h2{font-size:clamp(24px,3vw,34px);line-height:1.15;letter-spacing:-.02em;font-weight:700}
.band p{margin:0;color:var(--body);font-size:14px;border-left:1px solid var(--line-2);padding-left:24px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.stat{padding:18px 20px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass)}
.stat b{display:block;font-size:30px;line-height:1.2;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat .stat-text{font-size:20px;line-height:1.5;min-height:36px;display:flex;align-items:center}
a.stat:hover{border-color:var(--line-2)}
.onboard{padding:28px 32px;border-radius:var(--r-md);border:1px dashed var(--line-2);background:var(--glass)}
.onboard h2{font-size:22px;margin-bottom:8px}.onboard p{margin:6px 0;color:var(--body)}.onboard .muted{color:var(--muted);font-size:13px}
.onboard ol{margin:10px 0 0;padding-left:22px}.onboard li{margin:6px 0}.onboard a{color:var(--accent)}
.onboard code{font-family:var(--mono);font-size:.9em;padding:1px 6px;border-radius:5px;background:rgba(9,30,38,.5)}
.pn{display:flex;gap:12px;justify-content:space-between;margin:36px 0 10px;padding-top:18px;border-top:1px solid var(--line)}
.pn a{flex:1;max-width:48%;padding:12px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--glass);color:var(--body);line-height:1.4}
.pn a:hover{border-color:var(--line-2);color:var(--ink)}.pn a small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.pn a.next{text-align:right;margin-left:auto}

/* ---------- paper cards ---------- */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);gap:16px;overflow-x:auto;padding:4px 2px 18px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pcard{position:relative;display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:var(--r-md);border:1px solid var(--line);background:linear-gradient(180deg,rgba(206,226,232,.09),rgba(206,226,232,.04));scroll-snap-align:start;transition:transform .25s,border-color .25s,background .25s,box-shadow .25s;min-width:0}
.pcard:hover{transform:translateY(-4px);border-color:var(--line-2);box-shadow:0 18px 40px rgba(0,0,0,.22)}
.pcard.is-picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pcard-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-right:34px}
.rank{font-size:22px;font-weight:800;color:var(--ink);line-height:1;margin-right:4px;font-variant-numeric:tabular-nums}
.pcard h3{font-size:17px;line-height:1.4;font-weight:700}
.pcard h3 a:hover{color:var(--accent)}
.pcard .chips{display:flex;gap:6px;flex-wrap:wrap}
.pcard .tldr{margin:0;font-size:14px;color:var(--body);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.insight{margin:0;font-size:13px;color:var(--mist);padding:10px 12px;border-radius:var(--r-sm);background:rgba(9,30,38,.35);border-left:2px solid var(--accent)}
.insight b{display:block;font-size:11px;letter-spacing:.08em;color:var(--accent);margin-bottom:2px}
.pcard-foot{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.pcard-foot .grow{flex:1}
.pcard-foot a{color:var(--accent)}
.zstate{font-size:12px}
.pick{position:absolute;top:16px;right:16px;width:24px;height:24px}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.pick span{display:block;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line-2);background:rgba(9,30,38,.3);transition:background .2s,border-color .2s}
.pick input:checked+span{background:var(--accent);border-color:var(--accent)}
.pick input:checked+span:after{content:"";display:block;width:6px;height:11px;margin:4px 0 0 8px;border:solid #0C232B;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- steps ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{padding:24px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.step .n{grid-row:span 2;font-size:40px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1.2px var(--line-2)}
.step h3{font-size:17px}.step p{margin:0;font-size:14px;color:var(--muted)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.topic{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);transition:transform .25s,border-color .25s;text-align:left}
.topic:hover{transform:translateY(-3px);border-color:var(--line-2)}
.topic b{color:var(--ink);font-size:15px}.topic span{font-size:13px;color:var(--muted)}
.topic .count{font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- daily ---------- */
.datebar{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.datebar::-webkit-scrollbar{display:none}
.datebar a{flex:none;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);text-align:center;line-height:1.25;min-width:70px}
.datebar a b{display:block;color:var(--ink);font-size:16px}.datebar a small{font-size:11px;color:var(--muted)}
.datebar a[aria-current="date"]{background:var(--mist);border-color:transparent}.datebar a[aria-current="date"] b,.datebar a[aria-current="date"] small{color:#0C232B}
.funnel{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin:6px 0 4px}
.funnel div{flex:1;min-width:110px;padding:12px 14px;border-radius:var(--r-sm);background:var(--glass);border:1px solid var(--line)}
.funnel b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}.funnel span{font-size:12px;color:var(--muted)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--glass)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;background:rgba(9,30,38,.25)}
tr:last-child td{border-bottom:0}
.bar{position:relative;width:76px;height:6px;border-radius:9px;background:rgba(206,226,232,.12);margin-top:8px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--accent)}

/* ---------- library ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}
.input{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:rgba(9,30,38,.35);outline:0;min-width:0}
.input:focus{border-color:var(--accent)}
.toolbar .input{flex:1 1 260px}
select.input{padding-right:30px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{position:relative;display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:start;padding:16px 56px 16px 18px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);transition:border-color .2s,background .2s}
.row:hover{border-color:var(--line-2);background:var(--glass-2)}
.row.is-picked{border-color:var(--accent)}
.row .when{font-size:12px;color:var(--muted);line-height:1.5}.row .when b{display:block;color:var(--ink);font-size:14px}
.row h3{font-size:16px;line-height:1.4}.row h3 a:hover{color:var(--accent)}
.row p{margin:4px 0 6px;font-size:14px;color:var(--body)}
.row .side{text-align:right;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.row .pick{top:18px;right:18px}
.empty{padding:36px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r-md);color:var(--muted)}

/* ---------- paper ---------- */
.paper-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;align-items:start;padding-top:32px}
.toc{position:sticky;top:100px;font-size:13px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);padding-left:4px}
.toc a{padding:5px 12px;border-radius:8px;color:var(--muted);border-left:2px solid transparent;margin-left:-5px}
.toc a:hover{color:var(--ink)}.toc a.on{color:var(--ink);border-left-color:var(--accent);background:var(--glass)}
.toc .toc-sep{margin:10px 0 4px 12px;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.prose .deep-sep{margin:40px 0 8px;padding-top:14px;border-top:1px dashed var(--line);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.paper-head{padding:28px;border-radius:var(--r-lg);border:1px solid var(--line);background:linear-gradient(160deg,rgba(23,65,80,.72),rgba(12,35,43,.62)),url(assets/hero-sunrise-1200.jpg) center 62%/cover;background-blend-mode:normal,soft-light}
.paper-head h1{font-size:clamp(24px,3vw,34px);line-height:1.3;letter-spacing:-.015em;margin:10px 0 12px}
.meta-line{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--body)}
.paper-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.prose{max-width:none;color:var(--body);font-size:var(--prose-fs,16px);line-height:calc(var(--lh,1.7) + .15);padding-top:10px}
.prose h1{display:none}
.prose h2{font-size:22px;margin:38px 0 12px;padding-top:6px;letter-spacing:-.01em}
.prose h3{font-size:17px;margin:24px 0 8px}
.prose p,.prose ul,.prose ol{margin:10px 0}
.prose li{margin:4px 0}.prose strong{color:var(--ink)}
.prose a{color:var(--accent);border-bottom:1px solid rgba(169,220,225,.35)}
.prose blockquote{margin:14px 0;padding:14px 18px;border-radius:var(--r-sm);background:var(--glass);border:1px solid var(--line);color:var(--body)}
.prose blockquote p{margin:0}
.prose blockquote.c-tldr{border-left:3px solid var(--accent)}.prose blockquote.c-insight{background:linear-gradient(120deg,rgba(169,220,225,.14),rgba(206,226,232,.05));border-color:rgba(169,220,225,.4);color:var(--mist);font-size:17px}
.prose blockquote.c-read{border-left:3px solid var(--warn)}.prose blockquote.c-meta{font-size:13px}
.prose table{font-size:14px;margin:0}.prose .table-wrap{margin:14px 0}
.prose code{font-family:var(--mono);font-size:.88em;padding:1px 5px;border-radius:5px;background:var(--code)}
/* 高亮与批注 */
mark.hl{background:rgba(255,214,102,.45);color:inherit;padding:0 1px;border-radius:3px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.hl.c-green{background:rgba(120,220,160,.4)}mark.hl.c-pink{background:rgba(255,150,170,.4)}mark.hl.c-blue{background:rgba(130,190,255,.4)}
mark.hl.has-comment{border-bottom:2px dotted var(--accent)}
.hl-pop{position:absolute;z-index:30;display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line-2);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.hl-pop button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);cursor:pointer;padding:0}
.hl-pop .c-yellow{background:#FFD666}.hl-pop .c-green{background:#78DCA0}.hl-pop .c-pink{background:#FF96AA}.hl-pop .c-blue{background:#82BEFF}
.hl-pop .note-btn,.hl-pop .del-btn{width:auto;padding:0 10px;border-radius:999px;background:var(--glass);color:var(--ink);font-size:12px}
.side-panel{margin-top:18px;padding:14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);font-size:13px}
.side-panel h4{margin:0 0 8px;font-size:13px;color:var(--ink);letter-spacing:.04em}
.side-panel textarea{width:100%;min-height:120px;resize:vertical;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);padding:8px 10px;font-size:13px;line-height:1.6}
.side-panel .hls{display:flex;flex-direction:column;gap:6px;margin:8px 0 0;padding:0;list-style:none;max-height:40vh;overflow:auto}
.side-panel .hls li{padding:6px 8px;border-radius:8px;background:var(--panel);border-left:3px solid #FFD666;cursor:pointer;color:var(--body)}
.side-panel .hls li.c-green{border-left-color:#78DCA0}.side-panel .hls li.c-pink{border-left-color:#FF96AA}.side-panel .hls li.c-blue{border-left-color:#82BEFF}
.side-panel .hls li small{display:block;color:var(--muted);margin-top:2px}
.side-panel .save-state{color:var(--muted);font-size:12px;margin-top:6px}
.paper-layout .toc-col{position:sticky;top:100px;display:flex;flex-direction:column;max-height:calc(100vh - 120px);overflow:auto}
.paper-layout .toc-col .toc{position:static}
/* 文献库（Zotero） */
.zlib{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start;padding-top:20px}
.ztree{position:sticky;top:100px;max-height:calc(100vh - 120px);overflow:auto;padding:10px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);font-size:13.5px}
.ztree a{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;color:var(--body)}
.ztree a:hover{background:var(--glass-2);color:var(--ink)}.ztree a[aria-current="true"]{background:var(--mist);color:#0C232B}
:root[data-theme="light"] .ztree a[aria-current="true"]{background:#10272E;color:#fff}
.ztree .lvl1{padding-left:24px}.ztree .lvl2{padding-left:38px}.ztree .lvl3{padding-left:52px}
.zitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);margin-bottom:10px}
.zitem h3{font-size:15.5px;line-height:1.4}.zitem .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.zitem .acts{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:900px){.zlib{grid-template-columns:1fr}.ztree{position:static;max-height:240px}}
/* 趋势 */
.trend-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:18px}
.chart{padding:18px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass)}
.chart h3{font-size:15px;margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px}
.bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .bar i{display:block;width:100%;max-width:38px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--accent),rgba(169,220,225,.45));transition:height .6s cubic-bezier(.2,.7,.2,1)}
.bars .bar b{font-size:12px;color:var(--ink);margin-bottom:4px}.bars .bar span{font-size:10.5px;color:var(--muted);margin-top:6px;white-space:nowrap}
.linechart{width:100%;height:auto;display:block;overflow:visible}
.linechart .line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.linechart circle{fill:var(--panel);stroke:var(--accent);stroke-width:2}
.linechart circle:hover{r:5}
.linechart .grid{stroke:var(--line);stroke-width:1}
.linechart text{font-size:10.5px;fill:var(--muted);font-family:var(--mono)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbars .row2{display:grid;grid-template-columns:140px 1fr 36px;gap:10px;align-items:center;font-size:13px}
.hbars .row2 i{display:block;height:10px;border-radius:6px;background:var(--accent)}
.hbars .row2 b{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.summary-box{margin-top:16px;padding:20px 24px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass)}
.summary-box .prose{font-size:15px;padding:0}.summary-box .prose h2{font-size:17px;margin:16px 0 6px}
@media (max-width:900px){.trend-grid{grid-template-columns:1fr}}
.prose details{margin:20px 0;padding:12px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--glass)}
.prose summary{cursor:pointer;color:var(--ink)}
.prose small{display:block;margin-top:24px;color:var(--muted);font-size:12px}
.prose hr{border:0;border-top:1px solid var(--line);margin:30px 0}
.src{font-size:.78em;font-family:var(--mono);color:var(--accent);background:rgba(169,220,225,.08);border:1px solid rgba(169,220,225,.2);padding:0 6px;border-radius:6px;white-space:nowrap}
.tag-analysis{font-size:.75em;color:#0C232B;background:var(--warn);padding:1px 7px;border-radius:6px;font-weight:700;margin-right:4px}
.katex{font-size:1.04em}.katex-display{overflow-x:auto;overflow-y:hidden;padding:6px 0}
.md-inline .katex{font-size:1em}.md-inline code{font-family:var(--mono);font-size:.88em;padding:0 4px;border-radius:4px;background:rgba(9,30,38,.45)}.md-inline strong{color:var(--ink)}

/* ---------- hero quote, GitHub link ---------- */
.hero .quote{margin:26px 0 34px;max-width:46ch;color:rgba(238,245,246,.92);font-size:18px;line-height:1.7;padding:0 0 0 18px;border-left:2px solid rgba(243,183,166,.75)}
.hero .quote p{margin:0}
.hero .quote cite{display:block;margin-top:8px;font-size:13px;font-style:normal;color:rgba(238,245,246,.62);letter-spacing:.02em}
.gh{gap:6px}.gh svg{width:16px;height:16px;fill:currentColor}

/* ---------- paper rows (list with first-page thumbnail) ---------- */
.prows{display:flex;flex-direction:column;gap:14px}
.prow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:22px;padding:20px 22px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);transition:border-color .2s,background .2s,transform .25s}
.prow:hover{border-color:var(--line-2);background:var(--glass-2)}
.prow.is-picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.prow .pick{top:22px;left:20px;right:auto}
.prow-main{min-width:0;display:flex;flex-direction:column;gap:8px;padding-left:36px}
.prow h3{font-size:19px;line-height:1.35;font-weight:700}.prow h3 a:hover{color:var(--accent)}
.prow h3 .rank{font-size:13px;margin-right:10px;color:var(--accent);font-variant-numeric:tabular-nums}
.prow-authors{font-size:13px;color:var(--muted)}
.prow-tldr{margin:0;font-size:14.5px;color:var(--body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prow .insight{font-size:13px}
.prow-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:8px}
.prow-foot .grow{flex:1}.prow-foot a{color:var(--accent)}
.prow-thumb{position:relative;display:block;align-self:start;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#f4f1ea}
.prow-thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.prow-thumb .ph{display:none;position:absolute;inset:0;place-items:center;font-family:var(--mono);font-size:12px;color:#355;background:linear-gradient(160deg,#eae6dc,#cfd8dc)}
.prow-thumb.nothumb img{display:none}.prow-thumb.nothumb .ph{display:grid}
@media (max-width:700px){.prow{grid-template-columns:1fr}.prow-thumb{aspect-ratio:16/7}}

/* ---------- split PDF reader ---------- */
body.split-mode main.wrap{max-width:none}
.paper-split.on{display:grid;grid-template-columns:minmax(340px,var(--split,50%)) 10px minmax(340px,1fr);gap:0 12px;align-items:start}
.paper-split.on .paper-layout{grid-template-columns:1fr;gap:0}
.paper-split.on .toc-col{display:none}
.paper-split.dragging{user-select:none}.paper-split.dragging iframe{pointer-events:none}
.split-handle{align-self:stretch;position:sticky;top:96px;height:calc(100vh - 120px);border-radius:6px;background:var(--line);cursor:col-resize;transition:background .2s}
.split-handle:hover,.split-handle.drag{background:var(--accent)}
.pdf-pane{position:sticky;top:96px;height:calc(100vh - 120px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#2b2b2b}
.pdf-bar{display:flex;align-items:center;gap:12px;padding:8px 14px;font-size:13px;color:var(--muted);background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap}
.pdf-bar .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--body)}
.pdf-bar a{color:var(--accent)}
.pdf-pane iframe{flex:1;width:100%;border:0;background:#fff}
@media (max-width:1000px){.paper-split.on{grid-template-columns:1fr}.split-handle{display:none}.pdf-pane{position:static;height:70vh;margin-top:16px}}

/* ---------- review ---------- */
.review-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ritem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:18px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);margin-bottom:10px}
.ritem.is-picked{border-color:var(--accent)}
.ritem .pick{position:relative;top:auto;right:auto;margin-top:2px}
.ritem h3{font-size:16px;line-height:1.4}.ritem h3 a:hover{color:var(--accent)}
.ritem .meta-line{margin:6px 0}
.ritem p{margin:4px 0;font-size:14px}
.ritem .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ritem .err{color:var(--bad);font-size:13px}
.panel{padding:18px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);margin-bottom:14px}
.panel h3{font-size:15px;margin-bottom:10px}
.panel p{font-size:13px;color:var(--muted);margin:6px 0}
.panel .btn{width:100%;margin-top:8px}
.zpill{display:flex;align-items:center;gap:8px;font-size:13px}
.zpill i{width:9px;height:9px;border-radius:50%;background:var(--bad)}.zpill.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.log{font-family:var(--mono);font-size:12px;line-height:1.6;max-height:220px;overflow:auto;padding:10px 12px;border-radius:var(--r-sm);background:rgba(9,30,38,.55);border:1px solid var(--line);white-space:pre-wrap;color:var(--body)}

/* ---------- settings ---------- */
.settings-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.tcard{border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);margin-bottom:12px;overflow:hidden}
.tcard>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer}
.tcard>summary::-webkit-details-marker{display:none}
.tcard>summary b{color:var(--ink);font-size:16px}.tcard>summary .grow{flex:1;min-width:0}
.tcard>summary small{display:block;color:var(--muted);font-family:var(--mono);font-size:12px}
.tcard[open]>summary{border-bottom:1px solid var(--line)}
.tbody{padding:18px;display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label,.field .lab{font-size:12px;color:var(--muted);letter-spacing:.04em}
.field textarea,.field input[type=text],.field input[type=number]{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:rgba(9,30,38,.35);outline:0;resize:vertical}
.field textarea:focus,.field input:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.range{display:flex;align-items:center;gap:12px}.range input{flex:1;accent-color:var(--accent)}.range output{font-family:var(--mono);color:var(--ink);min-width:3ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:rgba(9,30,38,.35);min-height:44px;align-items:center}
.tags:focus-within{border-color:var(--accent)}
.tags .chip{font-family:var(--mono);font-size:12px}
.tags .chip button{border:0;background:none;color:var(--muted);padding:0;line-height:1;font-size:14px}
.tags .chip button:hover{color:var(--bad)}

<script type="text/markdown" id="demo-note">
# Calibrated for Which Policy? Conformal Uncertainty for Fixed World Models Under Intervention

> **作者** Ayush Mittal, Dhruv Gupta · **来源** [2610.35877v1](https://arxiv.org/abs/2610.35877) · [PDF](https://arxiv.org/pdf/2610.35877v1) · **方向** Selective Prediction via Conformal Prediction · **类型** theory · **价值** ★★★☆☆

> **TL;DR** 在预测器固定、条件机制 P(Y|X) 不变的假设下，用 domain classifier 估计 dQ_X/dP_X 并做 weighted conformal，给出 1−α−TV 与 classifier-regret 两层覆盖下界；在 192 个 Franka 转移的受控倾斜上把 55.0% 覆盖率恢复到 90.9%。

> **Core insight** 策略干预只改 X 的边缘分布而不改 P(Y|X) → 联合似然比只依赖 X、可由无标签 source/target 协变量学出 → 校准误差由 ratio 的 TV/L1 误差直接决定，预测器无需重训。

> **读不读** 选读：理论部分是 weighted conformal 加 TV 转移的清晰整合，对 agent 自我改进后阈值重校准有启发；实验过于受控，且只覆盖一步 marginal 的情形。

## 0. TL;DR
- 在 $P(Y|X)=Q(Y|X)$ 的假设下，策略干预等价于 covariate shift，ratio $w=dQ_X/dP_X$ 可由 domain classifier 学出。weighted conformal 在目标分布上的覆盖下界为 $1-\alpha-\mathrm{TV}(Q,\widehat Q)\ge 1-\alpha-\mathbb E_P|w-\widehat w|$，再由 classifier 的 log-loss regret 控制 $\mathbb E_P|w-\widehat w|$【Abstract, Prop. 3, Prop. 5】。
- 最强 shift（$\lambda=1.5$，名义 90%）下，ordinary conformal 覆盖 55.0%，oracle 91.0%，learned 90.9%；clip(5) 降到 83.8%【Table 1, Table 3】。
- 对 conformal_selective 方向是中等相关的参考。对 agent_rsi 的间接启发是：策略（自我）改变后，置信度门控的校准应随部署分布重做。但本文只做一步 marginal 预测，不涉及 LLM 或多步 agent【§9 Limitations】。

## 1. Problem formulation
- **输入/输出**：固定预测器 $m$ 与 score $r_m(X,Y)$；source 校准数据 $(X_i,Y_i)\sim P$ 带标签；目标是在 target 分布 $Q$ 上构造 $\mathcal C(X)$，使 $\mathbb P_Q\{Y\in\mathcal C(X)\}\ge 1-\alpha$【§2, §3】。
- **关键假设**：
  1. $P(Y|X)=Q(Y|X)$，且 $X$ 是"pre-outcome"变量（世界模型里 $X=(S,A)$）。
  2. $Q_X\ll P_X$（support 包含）。
  3. 校准样本 iid（实为 exchangeability），$\widehat w$ 用与校准独立的数据拟合【Prop. 1, 3】。
  4. 访问权限：score 只用预测残差，black-box 可用；ratio 估计只需无标签 target 协变量【§4】。
- **保证形式**：marginal coverage（对校准集与测试点联合取平均），finite-sample 的 conformal 部分加一个 TV 惩罚项。不是 conditional coverage，也不是 risk control。
- **粒度**：单步预测（一个 $(s,a)\to y$ 查询）。多步 occupancy shift 与联合轨迹覆盖明确留作 future work【§2.1, §9】。

## 2. Core insight
现有做法默认"换策略后世界模型要重新校准或重训" → 但转移核 $K$ 不变，变的只是查询分布 $X=(S,A)$，所以联合似然比是 $X$-可测的，且可由无标签 source/target 协变量的分类器识别 → 作者因此把校准度量为"相对部署分布"的量，用 weighted conformal 加 ratio 误差惩罚给出端到端覆盖界。

〔分析〕这个洞察本身是 Tibshirani et al. 2019 的 covariate shift 套到 policy intervention 的因果语言上（soft intervention，$d_t/d_b\cdot d\pi_t/d\pi_b$）。真正新的部分是误差传递链：classifier regret → ratio L1 → TV → coverage。其中 Lemma 4 的"在 source 律下积分使 $1-\eta$ 抵消"是一个小而干净的技巧。

## 3. Novelty delta
以下前作均依据原文 related work，未独立核实。

| 最相近的前作 | 它的做法 | 本文的差异 | 差异类型 |
|---|---|---|---|
| Weighted conformal under covariate shift (Tibshirani et al., 原文 ref 34) | 已知 / 估计的 ratio，精确 ratio 下有覆盖保证 | 给出估计 ratio 时的 TV / L1 覆盖惩罚，并接上 classifier regret | 新理论保证（增量） |
| Non-exchangeable / adaptive conformal (ref 2, 11) | 用权重或自适应处理偏离 exchangeability | 针对 policy intervention，用因果结构识别 ratio | 新问题设定（语境化） |
| Conformal counterfactual inference (ref 21) | 静态 treatment 的 propensity 加权 | 加上 state occupancy 因子，用于动力系统一步预测 | 新问题设定（窄） |
| Proper-loss 与 density ratio 的联系 (ref 23, 31, 3) | 分类概率与密度比的关系 | $(\rho\gamma)^{-1}$ 取代泛化 odds-map 的 $\gamma^{-2}$ | 新理论保证（常数级） |
| 世界模型 + conformal（refs 6, 30, 39） | 用 conformal 阈值做安全过滤、轨迹预测 | 在固定世界模型上显式按部署律重校准 | 工程组合 |

**判断**：偏增量。主要贡献是整合与干净的误差传递，TV 惩罚本身并不深。Appendix A 的 Wasserstein 反例（$W_2\to0$ 而 TV 不变）有澄清价值，Lean 形式化是少见的卖点。

## 4. Mechanism
1. 选定使 $P(Y|X)$ 稳定的 $X$（Algorithm 1 第 2 行）。
2. 用 source 与 target 的无标签协变量拟合 domain 后验 $h(x)=\Pr(D=1|X=x)$，令 $\widehat w_h=\frac{1-\rho}{\rho}\frac{h}{1-h}$（Eq. 7）。
3. 在 source 上计算 score $R_i=r_m(X_i,Y_i)$，不重训 $m$。
4. 对每个查询 $x$ 构造带测试点质量的加权经验测度（Eq. 3），取其 $(1-\alpha)$ 分位数 $q_{\widehat w}(x)$，输出 $\{y:r_m(x,y)\le q_{\widehat w}(x)\}$。

关键公式：
$$\mathbb P_Q\{Y\in\mathcal C_{\widehat w}\}\ge 1-\alpha-\mathrm{TV}(Q,\widehat Q),\quad \tfrac{d\widehat Q}{dP}=\tfrac{\widehat w}{\mathbb E_P\widehat w}\ \text{(Eq. 4–5)}$$
$$\mathbb E_{P_X}|w-\widehat w_h|=\tfrac1\rho\,\mathbb E_M\!\left[\tfrac{|\eta-h|}{1-h}\right]\le\tfrac{1}{\rho\gamma}\sqrt{\tfrac{\Delta_{\log}(h)}{2}}\ \text{(Eq. 9–10)}$$

## 5. Guarantees & assumptions
- **类型**：Eq. 5 对 conformal 部分是 finite-sample 的 marginal 保证，加一个确定性的 TV 惩罚；Eq. 10 依赖 population regret，是总体量【App. B.2】。
- **最脆弱的假设**：$P(Y|X)$ 不变；校准样本 iid（真实 Franka 数据来自 15 个 episode，同 episode 转移相关）；保证是对校准集随机性平均的 marginal。
- **多步 / 在线**：多步下 $d_t/d_b$ 需要 occupancy ratio；序列依赖直接破坏 exchangeability，Prop. 3 不再适用【§2.1, §9】。

## 6. Claim ↔ Evidence
| 作者的主要 claim | 支撑证据 | 证据强度 | 备注 |
|---|---|---|---|
| 策略偏移下 ordinary conformal 失效（90%→55.0%） | Table 1, Fig. 3, Table 3 | 中 | 偏移是在 192 点池上人为构造的倾斜，不是真实 policy 切换 |
| oracle / learned ratio 恢复目标覆盖（91.0% / 90.9%） | Table 1, Fig. 7 | 中 | logistic 模型对偏移"正确设定"，learned≈oracle 近乎必然【§5.2】 |
| clipping 以覆盖换 ESS（覆盖 90.9%→83.8%） | §6.3, Table 3 | 强 | 与 surrogate 论证一致；但仅一个 clip 阈值 |

## 7. Red flags & limitations
**作者已承认**：一步、marginal；需要共享条件动力学、support 包含；实验是 192 个转移上的受控倾斜【§9】。

**〔分析〕作者未充分讨论**：
- 校准与评估都从同一个 192 点池有放回抽样，很难暴露外推失败。
- 没有对比 nonexchangeable conformal、doubly-robust ratio 估计器或少量 target 标签的重校准。

## 8. Research hooks
1. **候选想法：RSI 门控的 ratio 重校准。** 自我改进后策略 $\pi_t$ 改变，原有 verifier / 置信度阈值在新 query 分布下失效；用 domain classifier 估计 ratio，对接受阈值做 weighted conformal。
2. **候选想法：多步 occupancy ratio 的 horizon 退化曲线。** 度量覆盖随 horizon $H$ 的衰减，并与轨迹级 importance weighting 对比。
3. **候选想法：把 TV 惩罚推广到 conformal risk control 的 selective risk。** 对有界单调损失，$\mathbb E_Q[\ell]\le\alpha+B\cdot\mathrm{TV}(Q,\widehat Q)$ 看起来成立（需要证明）。

## 9. 是否值得读原文
**选读。** 最该看 §3 Prop. 3 与 Eq. 4–6、§4 Lemma 4 的证明、Table 2 与 §6.3、Appendix A。实验部分可略读。

/* ---------- 行内 Markdown（卡片里的 TL;DR、insight 等） ---------- */
function mdInline(text) {
  const s = String(text ?? ""); if (!s) return "";
  if (!(window.marked && window.DOMPurify)) return esc(s);
  const math = []; const keep = (tex, display) => { math.push({ tex, display }); return `@@M${math.length - 1}@@`; };
  const src = s.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keep(t, true)).replace(/\$(?!\s)([^$\n]+?)\$/g, (_, t) => keep(t, false))
    // 旧笔记里裸写的下标变量（n_eff、d_t、x_i）自动排成公式；多字母名（topic_name）不受影响
    .replace(/\b([A-Za-z])_([A-Za-z0-9]{1,8})\b/g, (_, a, b) => keep(`${a}_{\\text{${b}}}`, false));
  const html = DOMPurify.sanitize(marked.parseInline(src, { gfm: true }));
  return `<span class="md-inline">${html.replace(/@@M(\d+)@@/g, (_, i) => { const m = math[+i]; try { return window.katex ? katex.renderToString(m.tex, { displayMode: false, throwOnError: false }) : esc(m.tex); } catch { return esc(m.tex); } })}</span>`;
}

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw Object.assign(new Error(`${r.status} ${url}`), { status: r.status });
  return r.json();
}
async function send(url, body, method = "POST") {
  const r = await fetch(url, { method, cache: "no-store", headers: { "Content-Type": "application/json", "X-DailyPaper": "1" }, body: JSON.stringify(body ?? {}) });
  let data = {};
  try { data = await r.json(); } catch { /* 非 JSON 响应 */ }
  if (!r.ok) throw Object.assign(new Error(data.detail || `${r.status} ${url}`), { status: r.status });
  return data;
}

function revealAll(root = document) {
  if (reducedMotion()) return;
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("play"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
  $$(".reveal:not(.play)", root).forEach((el, i) => { el.style.animationDelay = (i % 4) * 70 + "ms"; io.observe(el); });
}
function countUp(el, n) {
  n = Number(n) || 0;
  if (reducedMotion()) { el.textContent = n.toLocaleString(); return; }
  const t0 = performance.now();
  const tick = (t) => { const p = Math.min((t - t0) / 1100, 1); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))).toLocaleString(); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

async function decide(ids, action, collection = "") {
  if (!ids.length) return;
  const verb = { approve: "加入 Zotero", later: "标为稍后", reject: "标为不要", pending: "撤回" }[action];
  if (!isLocal()) {
    const st = { approve: "imported", later: "later", reject: "rejected", pending: "pending" }[action];
    ids.forEach((id) => (S.demoDecisions[id] = { status: st, collection: collection || "DailyPaper/示例" }));

  } else {

      (r.messages?.length ? r.messages : [`已${verb} ${ids.length} 篇`]).forEach((m) => toast(m, "ok"));

}

let runTimer = null;
async function startRun(pipeline, ids = []) {
  if (prefs().confirmRun && !confirm(pipeline === "daily" ? "现在运行今日任务？会调用模型并产生费用。" : `精读 ${ids.join(", ")}？会调用模型并产生费用。`)) return;
  if (!isLocal()) { toast(S.mode === "demo" ? `示例：会在本地助手里执行 dailypaper ${pipeline === "read" ? "read " + ids.join(" ") : "run"}` : "请在电脑上运行 dailypaper app 后再触发", S.mode === "demo" ? "" : "err"); return; }
  // 会真实调用模型，先确认并给出费用量级（按 Sonnet 精读约 $0.14 / 篇估算）
  const n = pipeline === "read" ? ids.length : Number(S.config?.daily?.top_k || DEMO_CONFIG.daily.top_k);
  const what = pipeline === "read" ? `精读 ${ids.join("、")}` : `运行今日任务（抓取 → 筛选 → 精读最多 ${n} 篇）`;
  if (!confirm(`${what}？\n会调用模型，大约 $${(n * 0.14).toFixed(2)}，需要几分钟。`)) return;
  try {
    const r = await send("/api/run", { pipeline, ids });
    (r.messages || [`已开始：${pipeline}`]).forEach((m) => toast(m, "ok"));
    pollRun();
  } catch (e) {
    toast(e.status === 404 ? "后端还没有 /api/run 接口（见 src/dailypaper/app/API.md 2.3）" : e.status === 409 ? "已有任务在运行，请等它结束" : "启动失败：" + e.message, "err");
  }
}

  const logEl = $("#run-log"); if (logEl) paintRun();
  if (S.run.running) runTimer = setTimeout(() => pollRun(), 2000);
  else if (!once && S.run.finished_at) { toast(S.run.ok ? "运行完成，正在刷新数据" : "运行结束，但有错误，请看日志", S.run.ok ? "ok" : "err"); boot(); }
}

async function loadPaper(id) {
  const base = S.index.find((p) => p.id === id) || {};
  if (S.mode === "demo") return { ...base, markdown: id === "2610.35877" ? $("#demo-note").textContent : `# ${base.title}\n\n> **${label("tldr")}** ${base.tldr}\n\n> **${label("core_insight")}** ${base.core_insight}\n\n这是界面演示用的示例条目，没有完整精读笔记。` };
  try { return { ...base, ...(await getJSON(`${S.site}api/papers/${encodeURIComponent(id.replace(/\//g, "_"))}.json`)) }; } catch { /* 继续 */ }
  if (isLocal()) { const n = await getJSON(`/api/note/${encodeURIComponent(id)}`); return { ...base, ...n.frontmatter, markdown: n.markdown }; }
  throw new Error("找不到这篇论文的笔记");
}
function waitLibs() {
  return new Promise((res) => { const ok = () => window.marked && window.DOMPurify && window.katex; if (ok()) return res(true); let n = 0; const t = setInterval(() => { if (ok() || ++n > 30) { clearInterval(t); res(ok()); } }, 100); });
}
const pdfUrl = (p) => (isLocal() && ARXIV_ID.test(String(p.id)) ? `/api/pdf/${encodeURIComponent(p.id)}` : p.url_pdf || "");
function renderMarkdown(md) {
  const math = [];
  const keep = (tex, display) => { math.push({ tex, display }); return `@@M${math.length - 1}@@`; };
  md = md.replace(/^---[\s\S]*?\n---\n/, "")
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keep(t, true))
    .replace(/\$(?!\s)([^$\n]+?)\$/g, (_, t) => keep(t, false))
    .replace(/〔分析〕/g, '<span class="tag-analysis">分析</span>')
    .replace(/【([^】\n]{1,80})】/g, '<span class="src">$1</span>');
  let html = DOMPurify.sanitize(marked.parse(md, { gfm: true }), { ADD_TAGS: ["details", "summary"] });
  html = html.replace(/@@M(\d+)@@/g, (_, i) => { const m = math[+i]; try { return katex.renderToString(m.tex, { displayMode: m.display, throwOnError: false }); } catch { return esc(m.tex); } });
  return html;
}

/* 同一列表顺序（日期降序、分数降序）下的上一篇 / 下一篇 */
function paperNeighbors(id) {
  const list = [...S.index].sort((a, b) => b.date.localeCompare(a.date) || b.score - a.score);
  const i = list.findIndex((p) => p.id === id);
  return { prev: i > 0 ? list[i - 1] : null, next: i >= 0 && i < list.length - 1 ? list[i + 1] : null };
}
function paperNav(id) {
  const { prev, next } = paperNeighbors(id);
  if (!prev && !next) return "";
  const link = (p, cls, label) => p ? `<a class="${cls}" href="#/paper/${encodeURIComponent(p.id)}"><small>${label}</small>${esc(p.title)}</a>` : "";
  return `<nav class="pn" aria-label="相邻论文">${link(prev, "prev", "← 上一篇")}${link(next, "next", "下一篇 →")}</nav>`;
}

    tog.textContent = on ? "关闭 PDF" : "阅读 PDF";
    try { sessionStorage.setItem("dp.pdf", on ? "1" : "0"); } catch { /* 无痕模式 */ }

  let saved = 0; try { saved = Number(localStorage.getItem("dp.split")) || 0; } catch { /* 忽略 */ }
  if (saved) split.style.setProperty("--split", saved + "px");
  handle.addEventListener("pointerdown", (e) => {
    e.preventDefault(); handle.setPointerCapture(e.pointerId); handle.classList.add("drag"); split.classList.add("dragging");

      try { localStorage.setItem("dp.split", String(parseInt(split.style.getPropertyValue("--split")) || "")); } catch { /* 忽略 */ }

    handle.addEventListener("pointermove", move); handle.addEventListener("pointerup", up); handle.addEventListener("pointercancel", up);

}

    try { return JSON.parse(localStorage.getItem("dp.anno." + id) || "null") || { highlights: [], note: "" }; } catch { return { highlights: [], note: "" }; }
  },

function applyHighlights(root, hls) {
  $$("mark.hl", root).forEach((m) => m.replaceWith(...m.childNodes));
  root.normalize();
  for (const h of hls) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const i = node.data.indexOf(h.text);
      if (i < 0 || node.parentElement.closest("mark.hl")) continue;
      const range = document.createRange(); range.setStart(node, i); range.setEnd(node, i + h.text.length);
      const mark = document.createElement("mark");
      mark.className = `hl c-${h.color}${h.comment ? " has-comment" : ""}`; mark.dataset.hl = h.id; mark.title = h.comment || "点击：批注 / 删除";
      try { range.surroundContents(mark); } catch { /* 跨元素的选区跳过 */ }
      break;
    }
  }
}
function setupAnnotations(id) {
  const prose = $("#prose"), panel = $("#anno-panel"), state = $("#anno-state"), list = $("#hl-list"), noteEl = $("#my-note");
  if (!prose || !panel) return;
  let data = { highlights: [], note: "" }, timer = null, pop = null;
  const persist = () => {
    clearTimeout(timer); state.textContent = "保存中…";
    timer = setTimeout(async () => {
      try { await annoStore.save(id, data); state.textContent = isLocal() ? "已保存" : "已保存在本浏览器（只读网站不写文件）"; }
      catch (e) { state.textContent = "保存失败：" + e.message; }
    }, 500);
  };
  const paintList = () => {
    list.innerHTML = data.highlights.map((h) => `<li class="c-${esc(h.color)}" data-goto="${esc(h.id)}">${esc(h.text.slice(0, 90))}${h.text.length > 90 ? "…" : ""}${h.comment ? `<small>批注：${esc(h.comment)}</small>` : ""}${h.section ? `<small>${esc(h.section)}</small>` : ""}</li>`).join("")
      || `<li style="border-left-color:transparent;color:var(--muted)">在正文里选中文字即可高亮或批注。</li>`;
  };
  const repaint = () => { applyHighlights(prose, data.highlights); paintList(); };
  annoStore.load(id).then((d) => { data = { highlights: d.highlights || [], note: d.note || "" }; noteEl.value = data.note; repaint(); });
  noteEl.addEventListener("input", () => { data.note = noteEl.value; persist(); });
  list.addEventListener("click", (e) => {
    const li = e.target.closest("[data-goto]"); if (!li) return;
    prose.querySelector(`mark[data-hl="${li.dataset.goto}"]`)?.scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "center" });
  });
  const closePop = () => { pop?.remove(); pop = null; };
  const showPop = (x, y, html) => {
    closePop(); pop = document.createElement("div"); pop.className = "hl-pop"; pop.innerHTML = html; document.body.append(pop);
    pop.style.left = Math.max(8, Math.min(x - pop.offsetWidth / 2, innerWidth - pop.offsetWidth - 8)) + "px";
    pop.style.top = Math.max(8, y + scrollY - pop.offsetHeight - 10) + "px";
  };
  const sectionOf = (node) => {
    let el = node.nodeType === 1 ? node : node.parentElement;
    while (el && el !== prose) { let s = el.previousElementSibling; while (s) { if (/^H[23]$/.test(s.tagName)) return s.textContent.trim(); s = s.previousElementSibling; } el = el.parentElement; }
    return "";
  };
  const uid = () => Math.random().toString(36).slice(2, 10);
  prose.addEventListener("mouseup", () => setTimeout(() => {
    const sel = getSelection(); const text = sel?.toString().trim();
    if (!text || text.length < 2 || text.length > 2000 || !prose.contains(sel.anchorNode) || sel.anchorNode.parentElement?.closest("mark.hl")) return;
    const r = sel.getRangeAt(0).getBoundingClientRect(); const section = sectionOf(sel.anchorNode);
    showPop(r.left + r.width / 2, r.top, ["yellow", "green", "pink", "blue"].map((c) => `<button type="button" class="c-${c}" data-c="${c}" title="高亮"></button>`).join("") + `<button type="button" class="note-btn" data-c="${esc(prefs().hlColor)}" data-note="1">高亮并批注</button>`);
    pop.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      const h = { id: uid(), text, color: b.dataset.c, comment: "", section };
      if (b.dataset.note) { const c = prompt("批注内容：", ""); if (c === null) { closePop(); return; } h.comment = c.trim(); }
      data.highlights.push(h); sel.removeAllRanges(); closePop(); repaint(); persist();
    });
  }, 10));
  prose.addEventListener("click", (e) => {
    const m = e.target.closest("mark.hl"); if (!m) return;
    const h = data.highlights.find((x) => x.id === m.dataset.hl); if (!h) return;
    const r = m.getBoundingClientRect();
    showPop(r.left + r.width / 2, r.top, `${h.comment ? `<span style="font-size:12px;max-width:260px;color:var(--body)">${esc(h.comment)}</span>` : ""}<button type="button" class="note-btn" data-edit="1">${h.comment ? "改批注" : "加批注"}</button><button type="button" class="del-btn" data-del="1">删除</button>`);
    pop.addEventListener("click", (ev) => {
      const b = ev.target.closest("button"); if (!b) return;
      if (b.dataset.del) data.highlights = data.highlights.filter((x) => x.id !== h.id);
      else { const c = prompt("批注内容：", h.comment); if (c === null) { closePop(); return; } h.comment = c.trim(); }
      closePop(); repaint(); persist();
    });
    e.stopPropagation();
  });
  document.addEventListener("mousedown", (e) => { if (pop && !pop.contains(e.target)) closePop(); });
}

/* ---------- 阅读趋势 ---------- */
function clientTrends(days) {
  const end = new Date(); const start = new Date(end); start.setDate(end.getDate() - days + 1);
  const iso = (d) => d.toISOString().slice(0, 10); const s = iso(start), e = iso(end);
  const entries = S.index.filter((p) => p.date >= s && p.date <= e);
  const per_day = [];
  for (let i = 0; i < days; i++) { const d = new Date(start); d.setDate(start.getDate() + i); const k = iso(d); per_day.push({ date: k, count: entries.filter((p) => p.date === k).length }); }
  const count = (arr) => { const m = {}; arr.forEach((x) => (m[x] = (m[x] || 0) + 1)); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  return {
    start: s, end: e, days, total: entries.length, per_day,
    per_topic: count(entries.flatMap((p) => p.topics || [])).map(([id, c]) => ({ id, name: tname(id), count: c })),
    per_type: count(entries.map((p) => p.paper_type).filter(Boolean)).map(([type, c]) => ({ type, count: c })),
    top: [...entries].sort((a, b) => (b.value_score - a.value_score) || (b.score - a.score)).slice(0, 5),
    avg_value: entries.length ? (entries.reduce((a, p) => a + (p.value_score || 0), 0) / entries.length).toFixed(2) : 0, summary: null,
  };
}
/* 超过两周的区间用折线图（内联 SVG，无依赖） */
function lineChart(series) {
  const W = 640, H = 170, padL = 28, padR = 10, padT = 12, padB = 26;
  const n = series.length, max = Math.max(1, ...series.map((d) => d.count));
  const x = (i) => padL + (n === 1 ? 0 : (i / (n - 1)) * (W - padL - padR));
  const y = (v) => padT + (1 - v / max) * (H - padT - padB);
  const pts = series.map((d, i) => [x(i), y(d.count)]);
  const line = pts.map(([a, b], i) => `${i ? "L" : "M"}${a.toFixed(1)},${b.toFixed(1)}`).join(" ");
  const area = `${line} L${x(n - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
  const step = n > 60 ? 14 : n > 30 ? 7 : n > 14 ? 5 : 2;
  const ticks = series.map((d, i) => (i === n - 1 || (i % step === 0 && n - 1 - i >= Math.max(1, step / 2))) ? `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === n - 1 ? "end" : i === 0 ? "start" : "middle"}">${esc(d.date.slice(5).replace("-", "/"))}</text>` : "").join("");
  const grid = [0, Math.ceil(max / 2), max].filter((v, i, a) => a.indexOf(v) === i).map((v) => `<line x1="${padL}" x2="${W - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="grid"/><text x="${padL - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`).join("");
  const dots = series.map((d, i) => d.count ? `<circle cx="${x(i).toFixed(1)}" cy="${y(d.count).toFixed(1)}" r="3.2"><title>${esc(d.date)}：${d.count} 篇</title></circle>` : "").join("");
  return `<svg class="linechart" viewBox="0 0 ${W} ${H}" role="img" aria-label="每日精读篇数折线图">
    <defs><linearGradient id="lc-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#lc-fill)"/><path d="${line}" class="line"/>${dots}${ticks}</svg>
    <p style="margin:6px 0 0;font-size:12px;color:var(--muted)">共 ${series.reduce((a, d) => a + d.count, 0)} 篇 · 单日最多 ${max} 篇 · 悬停圆点看具体日期</p>`;
}

/* ---------- 提示词与 Skill：编辑 prompts/ 下的文件（程序校验 + LLM 审核）、lens 目录与规则、外部 skill ---------- */

const ruleRow = (r, i) => `<div class="rule" data-rule-i="${i}"><input type="text" data-rk="when" value="${esc(JSON.stringify(r.when))}" placeholder='{"always": true}'><input type="text" data-rk="use" value="${esc(r.use.join(", "))}" placeholder="topic:*, type:*"><div class="acts"><button class="btn sm ghost" type="button" data-rule-up title="上移">↑</button><button class="btn sm ghost" type="button" data-rule-del title="删除">×</button></div></div>`;

let lastKey = "";
async function route(force = false) {
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const [name = "", arg = ""] = path.split("/").map(decodeURIComponent);
  const key = path + "?" + (qs || "");
  if (!["", "daily", "library", "paper", "review", "settings", "zlib", "trends"].includes(name)) return; // 页内锚点
  if (key === lastKey && !force) return;
  lastKey = key;
  document.removeEventListener("keydown", tagKeys);
  $("#view").removeEventListener("click", tagClicks);
  const view = name || "home"; const params = new URLSearchParams(qs || "");
  $$("[data-nav]").forEach((a) => { if (a.dataset.nav === (view === "paper" ? "library" : view)) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const root = $("#view");
  document.body.classList.remove("split-mode");
  try {
    await waitLibs();  // 卡片里的行内 Markdown / 公式需要 marked、DOMPurify、KaTeX
    const html = await VIEWS[view](arg, params);
    root.innerHTML = `<div class="view">${html}</div>`;
    if (!force) window.scrollTo({ top: 0, behavior: "auto" });
    await VIEWS[view].after?.(arg, params);
    revealAll(root); syncSelection();
    document.title = { home: "DailyPaper", daily: "今日 · DailyPaper", library: "文库 · DailyPaper", paper: "论文 · DailyPaper", review: "审核台 · DailyPaper", settings: "设置 · DailyPaper", zlib: "文献库 · DailyPaper", trends: "趋势 · DailyPaper" }[view];
  } catch (e) {
    root.innerHTML = `<div class="view"><div class="page-head"><h1>出错了</h1><p>${esc(e.message)}</p></div><a class="btn" href="#/">回到首页</a></div>`;
  }
}

});
$$("[data-bulk]").forEach((b) => b.addEventListener("click", () => decide([...S.selected], b.dataset.bulk, $("#sel-collection").value)));
$("#sel-clear").addEventListener("click", () => { S.selected.clear(); syncSelection(); });
$("#run-now").addEventListener("click", () => startRun("daily"));
// 顶栏主题按钮：白天 / 夜间快捷切换（与 设置 → 外观 同一个偏好）
$("#theme-toggle").addEventListener("click", () => {
  setPref("theme", isLight() ? "dark" : "light");
  if (location.hash.startsWith("#/settings")) route(true);
});
// 键盘：首页 / 聚焦搜索；论文页 ← → 切换上一篇 / 下一篇
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select, [contenteditable]") || e.metaKey || e.ctrlKey || e.altKey) return;
  const m = location.hash.match(/^#\/paper\/([^?]+)/);
  if (e.key === "/" && $("#q")) { e.preventDefault(); $("#q").focus(); }
  else if (m && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    const { prev, next } = paperNeighbors(decodeURIComponent(m[1]));
    const to = e.key === "ArrowLeft" ? prev : next;
    if (to) location.hash = "#/paper/" + encodeURIComponent(to.id);
  }
});
addEventListener("hashchange", () => route());
boot();
</script>
</body>
</html>
